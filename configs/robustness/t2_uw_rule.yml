# T2 dla UW-attention z WDRAŻALNYM sygnałem u i dla ZŁOŻENIA bramka + UW.
#
# SKĄD TEN PLAN. `t2_uw_src` (results/t2_uw_src.md) rozdzielił mechanizm od sygnału:
# UW z głowy obserwacyjnej = zero na obu sieciach, wyrocznia modulacji (u = ułamek
# martwych pasów wjazdowych z warstwy awarii) = Δ vs rdzeń −96 / −167 s (JiNan,
# `mask0p25_int` / `mask0p5_int`), −54 / −114 s (HangZhou), −21 / −24 s przy `mask0p5`,
# wszystko |t| ≥ 2,8. Wąskim gardłem była więc GŁOWA, nie idea. Ale bramka-reguła
# z `t2_gate_real` już dziś schodzi niżej niż sufit UW (JiNan `mask0p25_int` ~353 s
# wobec 414 s, porównanie nieparowane — inne losowania), więc pytania są dwa:
#
#   (1) Czy UW z sygnałem, który JUŻ działa jako bramka (licznik zamrożonych
#       detektorów, `controllers.RuleUncertainty`), zbiera sufit wyroczni?
#   (2) Czy UW DOKŁADA coś do bramki? To jest pytanie, od którego zależy, czy UW
#       zostaje w pracy jako element architektury, czy jako wynik negatywny.
#
# DLACZEGO (2) MOŻE DAĆ NIEZERO. Bramka przełącza AKCJĘ martwego węzła na FixedTime,
# ale jego popsuta obserwacja dalej idzie przez `hidden_embedding` do sąsiadów jako
# wiadomość GAT — bramka niczego tu nie wycina. UW działa dokładnie na tym kanale:
# krawędź j→i dostaje u(j). Bramka naprawia WŁASNĄ decyzję martwego węzła, UW —
# decyzje jego zdrowych sąsiadów. Te kanały są rozłączne z konstrukcji; czy ich
# zyski się sumują, mówi dopiero pomiar.
#
# KOLUMNY (wszystkie z TEGO SAMEGO checkpointu, ten sam zestaw losowań, n = 5):
#   gatppo                 rdzeń, odniesienie dla kolumn pojedynczych
#   gatppo_uw_rule         UW, u z reguły                 vs rdzeń       → pytanie (1)
#   gatppo_gate_rule       bramka-reguła (jak t2_gate_real, ale n=5 i te losowania)
#   gatppo_gate_rule_uw    bramka-reguła + UW z reguły    vs gate_rule   → pytanie (2)
#   gatppo_gate_oracle     wyrocznia bramki (0,75, jak t2_gate_real)
#   gatppo_gate_oracle_uw  wyrocznia bramki + wyrocznia UW vs gate_oracle → sufit (2)
#   fixedtime
#
# u Z REGUŁY (`RuleUncertainty`): ułamek ruchów węzła zamrożonych przez całe okno,
# TYLKO powyżej progu bramki (`gate_ref`: JiNan 0,25, HangZhou 0,875 — kwantyl 99,5%
# na czystym oknie), poniżej zero. Bez progu modulacja strzelałaby na czystym: pusty
# wlot raportuje zero i wygląda na zamrożony. Okno i próg są TE SAME co w bramce,
# więc złożenie czyta jeden detektor, a nie dwa różnie nastrojone. Strona źródła
# i τ = 0,25 jak w wyroczni — kolumny różni wyłącznie definicja u. Histerezy UW nie
# ma: modulacja jest miękka i nie resetuje fazy, więc nie ma czego wygładzać.
#
# HIPOTEZY ZAPISANE PRZED POMIAREM:
#   R1 (no-op): `clean` i `gauss*` bez istotnej różnicy dla `gatppo_uw_rule` vs rdzeń
#      — reguła przy gauss2 przekracza próg w 0% decyzji (zrzut BC, `t2_gate_real`).
#   R2 (pytanie 1): przy `mask*_intersection` `gatppo_uw_rule` istotnie lepszy od
#      rdzenia na obu sieciach i blisko wyroczni z `t2_uw_src` (martwe skrzyżowanie
#      = wszystkie ruchy zero = ułamek 1,0, powyżej obu progów). Opóźnienie o okno
#      (12 decyzji) kosztuje niewiele. Przy `mask0p5`: JiNan częściowo, HangZhou
#      ~zero (próg 0,875 przy maskach pasowych milczy — tak samo milczała bramka).
#   R3 (`hold`): ~zero. Wyrocznia UW była tam na zerze (−0,5 / −0,3 / +0,6 / −0,2),
#      więc reguła nie ma czego zebrać, choć zamrożenie to jej kryterium.
#   R4 (pytanie 2, ROZSTRZYGAJĄCA): `gatppo_gate_oracle_uw` vs `gatppo_gate_oracle`
#      — sufit złożenia. Przewidywanie: mały zysk przy `mask*_intersection`, bo
#      bramka zabiera już większość szkody (C4: odporność = nieczytanie zepsutych
#      danych), a po przełączeniu zostaje tylko kanał wiadomości do sąsiadów.
#      Bez przekonania co do znaku przy `mask0p5`.
#   Odczyt:
#   - R4 bez zysku → UW jest REDUNDANTNE wobec fallbacku nawet przy idealnym
#     sygnale. C5 zamknięte: mechanizm ma dodatni sufit, ale zawiera się w tym, co
#     daje bramka. Do pracy jako wynik negatywny z wyjaśnieniem, nie jako zero.
#   - R4 z zyskiem, `gatppo_gate_rule_uw` vs `gatppo_gate_rule` też istotnie →
#     UW wraca jako POZYTYWNY składnik architektury (komplementarny kanał,
#     wdrażalny, bez treningu). Wtedy przepisać C5 i dopisać złożenie do C6.
#   - R4 z zyskiem, wersja z regułą na zerze → sygnał reguły nie wystarcza do
#     złożenia; future work.
#
# Diagnostyka: `gate_*` jak w `t2_gate_real`, `uw_spread`/`uw_active` jak w `t2_uw`
# (złożenie raportuje obie — `GatedController.episode_stats` scala je z polityką).
#
# WYMAGA: runs/heads/gate_ref__<sieć>.npz (są na laptopie i gliderze, te same co
# w `t2_gate_real`). Głowy obserwacyjnej NIE wymaga.
name: t2_uw_rule
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2, 3, 4]}
  gatppo_uw_rule:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source, u: rule}
  gatppo_gate_rule:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    gate: {kind: rule, k_on: 3, k_off: 6}
  gatppo_gate_rule_uw:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    gate: {kind: rule, k_on: 3, k_off: 6}
    uw: {tau: 0.25, side: source, u: rule}
    baseline: gatppo_gate_rule
  gatppo_gate_oracle:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    gate: {kind: oracle, threshold: 0.75}
  gatppo_gate_oracle_uw:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    gate: {kind: oracle, threshold: 0.75}
    uw: {tau: 0.25, side: source, u: oracle}
    baseline: gatppo_gate_oracle
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
