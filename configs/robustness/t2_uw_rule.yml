# T2 for UW-attention with a DEPLOYABLE u signal and for the gate + UW COMPOSITION.
#
# WHERE THIS PLAN COMES FROM. `t2_uw_src` (results/t2_uw_src.md) separated the mechanism from
# the signal: UW from the observation head = zero on both networks, the modulation oracle
# (u = fraction of dead inbound lanes from the failure layer) = delta vs the core -96 / -167 s
# (JiNan, `mask0p25_int` / `mask0p5_int`), -54 / -114 s (HangZhou), -21 / -24 s at `mask0p5`,
# all |t| >= 2.8. The bottleneck was thus the HEAD, not the idea. But the rule gate from
# `t2_gate_real` already goes lower than the UW ceiling (JiNan `mask0p25_int` ~353 s vs
# 414 s, an unpaired comparison with other draws), so there are two questions:
#
#   (1) Does UW with a signal that ALREADY works as a gate (the frozen detector counter,
#       `controllers.RuleUncertainty`) collect the oracle ceiling?
#   (2) Does UW ADD anything to the gate? This question decides whether UW stays in the
#       thesis as an architectural element or as a negative result.
#
# WHY (2) MAY BE NONZERO. The gate switches the dead node's ACTION to FixedTime, but its
# broken observation still flows through `hidden_embedding` to the neighbours as a GAT
# message; the gate cuts nothing there. UW acts exactly on that channel: edge j->i gets
# u(j). The gate fixes the dead node's OWN decision, UW the decisions of its healthy
# neighbours. These channels are disjoint by construction; whether their gains add up
# only measurement can tell.
#
# COLUMNS (all from THE SAME checkpoint, the same set of draws, n = 5):
#   gatppo                 core, reference for single columns
#   gatppo_uw_rule         UW, u from the rule              vs core         -> question (1)
#   gatppo_gate_rule       rule gate (as t2_gate_real, but n=5 and these draws)
#   gatppo_gate_rule_uw    rule gate + UW from the rule     vs gate_rule    -> question (2)
#   gatppo_gate_oracle     gate oracle (0.75, as t2_gate_real)
#   gatppo_gate_oracle_uw  gate oracle + UW oracle          vs gate_oracle  -> ceiling of (2)
#   fixedtime
#
# u FROM THE RULE (`RuleUncertainty`): the fraction of a node's movements frozen over the
# whole window, ONLY above the gate threshold (`gate_ref`: JiNan 0.25, HangZhou 0.875, the
# 99.5% quantile on the clean window), zero below. Without the threshold the modulation
# would fire on clean: an empty approach reports zero and looks frozen. The window and
# threshold are THE SAME as in the gate, so the composition reads one detector, not two
# tuned differently. Source side and tau = 0.25 as in the oracle: only the definition of u
# separates the columns. UW has no hysteresis: the modulation is soft and does not reset
# the phase, so there is nothing to smooth.
#
# HYPOTHESES RECORDED BEFORE MEASUREMENT:
#   R1 (no-op): `clean` and `gauss*` without a significant difference for `gatppo_uw_rule` vs
#      the core; the rule crosses its threshold at gauss2 in 0% of decisions (BC dataset,
#      `t2_gate_real`).
#   R2 (question 1): at `mask*_intersection` `gatppo_uw_rule` significantly better than the
#      core on both networks and close to the oracle from `t2_uw_src` (a dead intersection
#      = all movements zero = fraction 1.0, above both thresholds). The window delay
#      (12 decisions) costs little. At `mask0p5`: JiNan partly, HangZhou ~zero (threshold
#      0.875 stays silent under lane masks, as the gate did).
#   R3 (`hold`): ~zero. The UW oracle was at zero there (-0.5 / -0.3 / +0.6 / -0.2), so the
#      rule has nothing to collect, although freezing is its criterion.
#   R4 (question 2, DECISIVE): `gatppo_gate_oracle_uw` vs `gatppo_gate_oracle`, the
#      composition's ceiling. Prediction: a small gain at `mask*_intersection`, since the
#      gate already removes most of the harm (C4: robustness = not reading broken data),
#      and after switching only the message channel to the neighbours remains.
#      No conviction about the sign at `mask0p5`.
#   Reading:
#   - R4 without a gain -> UW is REDUNDANT with the fallback even with a perfect signal.
#     C5 closed: the mechanism has a positive ceiling, but it is contained in what the
#     gate gives. Into the thesis as a negative result with an explanation, not as a zero.
#   - R4 with a gain, and `gatppo_gate_rule_uw` vs `gatppo_gate_rule` also significant ->
#     UW returns as a POSITIVE architectural component (a complementary channel,
#     deployable, without training). Then rewrite C5 and add the composition to C6.
#   - R4 with a gain, the rule version at zero -> the rule signal is not enough for the
#     composition; future work.
#
# Diagnostics: `gate_*` as in `t2_gate_real`, `uw_spread`/`uw_active` as in `t2_uw` (the
# composition reports both; `GatedController.episode_stats` merges them with the policy's).
#
# REQUIRES: runs/heads/gate_ref__<network>.npz (on the laptop and the GPU machine, the same
# as in `t2_gate_real`). Does NOT require the observation head.
name: t2_uw_rule
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2, 3, 4]}
  gatppo_uw_rule:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source, u: rule}
  gatppo_gate_rule:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    gate: {kind: rule, k_on: 3, k_off: 6}
  gatppo_gate_rule_uw:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    gate: {kind: rule, k_on: 3, k_off: 6}
    uw: {tau: 0.25, side: source, u: rule}
    baseline: gatppo_gate_rule
  gatppo_gate_oracle:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    gate: {kind: oracle, threshold: 0.75}
  gatppo_gate_oracle_uw:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    gate: {kind: oracle, threshold: 0.75}
    uw: {tau: 0.25, side: source, u: oracle}
    baseline: gatppo_gate_oracle
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
