# Do TWO robustness levers COMPOSE: the gate (inference) x failure training (domain
# randomization). A 2x2 square from one set of draws.
#
# WHERE THE QUESTION COMES FROM. `t2_train_uw` was to measure the mechanism and did (zero,
# section 5a of the note), but its CONTROL arm turned out to be a result: the core trained
# with failures beats the core trained on clean by -140.0 s at `mask0p5` (t = -10.8, better
# in 15/15) and by -206.2 s at `mask0p5_intersection` (t = -4.69, 14/15), at the price of
# +6.1 s on clean (t = +4.76, 0/3). This is the SECOND working robustness mechanism in this
# thesis and the first acting at the level of TRAINING rather than inference.
#
# Separately the gate beats DR on every axis (`mask0p5`: -206.9 vs -140.0; clean: -0.3 vs
# +6.1), so as an ALTERNATIVE domain randomization is dominated and there is nothing to
# write about. The question is different: these are two DIFFERENT levers. DR improves what
# the policy does with a broken reading, the gate stops reading it at all. After DR
# `mask0p5` = 592.5 s, so the gate still has ~85 s of headroom above FixedTime (507.0)
# there, exactly the gap the gate alone did not close ("Open" in section 2b: rule 525.7 vs
# FixedTime 507.0).
#
# THE SQUARE (four learned columns, all frozen, the same failure draws):
#
#                      | no gate                | with rule gate
#   clean core         | gatppo                 | gatppo_gate_rule
#   core w/ failures   | gatppo_fail            | gatppo_fail_gate_rule
#
# THREE READINGS OF THE SAME TABLE:
#   gatppo_gate_rule      vs gatppo       = the gate alone       (replicates t2_gate_real)
#   gatppo_fail           vs gatppo       = DR alone             (the new result of t2_train_uw)
#   gatppo_fail_gate_rule vs gatppo_fail  = the gate ON TOP of DR  <- the plan's question
#
# HYPOTHESES RECORDED BEFORE MEASUREMENT:
#
#  H1 (composition). The gate on the DR core delivers LESS than on the clean core, since both
#     levers largely repair the same harm, but not zero, since DR leaves `mask0p5` 85 s above
#     FixedTime and that is exactly where the gate has its largest advantage. Guessed range at
#     `mask0p5`: between -60 and -150 s against -206.9 s on the clean core.
#     The DECISIVE result is the absolute ATT of column 4 at `mask0p5`: if it goes below
#     507.0 s, the composition is the ONLY configuration in this thesis that beats FixedTime
#     in the worst scenario, and that is the deployment recommendation of chapter 4.
#
#  H2 (clean). Column 4 on clean ~ column 3 (i.e. ~302 s, ~6 s worse than the core); the gate
#     does not fire on clean. NOTE, this is NOT settled: the rule threshold is calibrated on
#     the BC dataset from Advanced-MP, but the STATE DISTRIBUTION under the DR policy differs
#     (proof: +6.1 s on clean), so the fraction of legitimately standing movements may have
#     changed and the 0.5% false-alarm budget need not hold. Checked DIRECTLY by the
#     `gate_share__clean` diagnostic: on the clean core it came out at 0.0146-0.0181. If
#     column 4 comes out SIGNIFICANTLY higher, the threshold does not transfer between
#     policies, and that must be written as a limitation of the calibration method,
#     whatever ATT does.
#
#  H3 (noise). `gauss2`: column 4 does not fire once, like column 2 (15/15 ties in
#     `t2_gate_real`). Noise does not freeze a reading, and that is all the rule sees. If it
#     fires, H2 has failed and the threshold is too low for the DR policy.
#
# SCOPE: two networks, 3 seeds. HangZhou added 2026-09-20 AFTER the JiNan result: the
# composition went below the FixedTime threshold there (481.1 vs 507.0), and a claim of a
# solution cannot rest on one network. Requires `p1_fail` on HangZhou (3 GPU runs).
#
# WHAT TO EXPECT, recorded before measurement: on HangZhou the gate with the artefact
# threshold (0.875) is CONSERVATIVE: it collects 58% of the oracle headroom against 98% on
# JiNan (section 2b of the note), and the `t2_gate_thr` sweep showed its optimum lies at
# 0.500. At the default threshold the composition may therefore NOT go below FixedTime
# (568.9) on HangZhou, although it did on JiNan. If so, the conclusion reads "the
# composition works, but a percentile-calibrated threshold gives away too much on sparse
# networks", i.e. section 8.4, not a failure of the composition. Only a column with threshold
# 0.500 would settle it, which is NOT HERE, and adding it would be choosing the threshold
# AFTER seeing the result.
#
# COST: 13 runs (4 columns x 3 seeds + FixedTime), 8 splits, 1 + 7x5 = 36 episodes per run.
# Evaluation of frozen weights: CPU, laptop, NO training. All checkpoints are local:
# runs/t1/gatppo__cityflow_jinan3x4_4ph__s{0,1,2}_y5/engine/core.pt (clean core, no suite
# suffix) and ...__s{0,1,2}_y5__p1_fail/engine/core.pt (DR core).
#
# THE GATE THRESHOLD IS NOT RECOMPUTED, on purpose. `RuleGate` reads only the observation
# vector (`window`, `threshold`, `n_mov`), never the policy weights, and takes its threshold
# from `runs/heads/gate_ref__cityflow_jinan3x4_4ph.npz`, calibrated on the BC dataset from
# Advanced-MP. It is thus independent of the checkpoint underneath, and both gated columns
# get EXACTLY the same detector. Recomputing it for the DR policy would confound the
# column 2 vs 4 difference with the gate's recalibration.
#
# REPORT TRAP, READ BEFORE RUNNING. `analysis/degradation.py::mechanism_pairs` emits a delta
# row only for columns of kind `policy_uw`/`policy_gate`. `gatppo_fail` is a plain `policy`,
# so despite the explicit `baseline:` it WILL NOT REACH the "Mechanism: ... vs ..." table,
# exactly as in `t2_train_uw`, where the strongest number of the whole plan was not
# computed. Columns 2 and 4 compute themselves; the "DR vs clean core" row must, until
# `mechanism_pairs` is fixed, be computed separately, pairing by (scenario, seed, draw)
# from `runs/t2/*/metrics.csv`. `baseline:` is written here anyway: `load_plan` validates
# it and it will be ready once the report learns this.
#
# SCENARIOS: the same as `t2_gate_real` (the tables are to be read side by side), PLUS
# `mask0p5_intersection`: there DR gave the most (-206.2 s) and as the only scenario went
# below FixedTime (483.8 vs 507.0), so the composition question is sharpest there. It is
# also a scenario OUTSIDE the `p1_fail` training mix (the mix has `mask 0.25
# unit:intersection`), the only place in the table where the DR gain is pure
# generalisation over severity rather than reproduction of the training distribution.
# This row carries the burden of proof.
#
# REQUIRES: runs/heads/gate_ref__cityflow_jinan3x4_4ph.npz (present) and the computed
# `p1_fail` suite (present, 3 seeds).
name: t2_gate_dr
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  # 1. core trained on clean, the reference of the whole table. The default parent,
  #    `gatppo__<network>__s<seed>_y5` WITHOUT a suite suffix, the same weights that
  #    measured `t2_uw`, `t2_gate_real` and arm 1 of `t2_train_uw`.
  gatppo: {seeds: [0, 1, 2]}

  # 2. the gate on the clean core. A replication of the `t2_gate_real` column INSIDE this
  #    plan, so "gate on clean vs gate on DR" comes from one set of draws rather than two
  #    tables. The default baseline (`gatppo`) is correct here.
  gatppo_gate_rule:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, k_on: 3, k_off: 6}

  # 3. core trained with failures, without a gate (arm 2 of `t2_train_uw`)
  gatppo_fail:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_fail"
    baseline: gatppo

  # 4. COMPOSITION: the gate on the core trained with failures. An EXPLICIT baseline: the
  #    default ("the first `policy` column of the same agent") would hit `gatppo` and
  #    measure the gate TOGETHER with failure training, the same silent error `Plan.baseline`
  #    was created for in `t2_train_uw`. Here only the gate's increment must come out.
  gatppo_fail_gate_rule:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_fail"
    gate: {kind: rule, k_on: 3, k_off: 6}
    baseline: gatppo_fail

  # break-even threshold: 507.0 s on JiNan. H1 is read against it.
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 2.0}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
