# Czy DWIE dźwignie odporności SIĘ SKŁADAJĄ — bramka (inferencja) × trening z awariami
# (domain randomization). Kwadrat 2×2 z jednego zestawu losowań.
#
# SKĄD TO PYTANIE. `t2_train_uw` miał mierzyć mechanizm i zmierzył go (zero, §5a notatki),
# ale jego ramię KONTROLNE okazało się wynikiem: rdzeń trenowany z awariami bije rdzeń
# trenowany na czystym o −140,0 s przy `mask0p5` (t = −10,8, lepszy w 15/15) i o −206,2 s
# przy `mask0p5_intersection` (t = −4,69, 14/15) — za cenę +6,1 s na czystym (t = +4,76,
# 0/3). To jest DRUGI działający mechanizm odporności w tej pracy i pierwszy, który działa
# na poziomie TRENINGU, a nie inferencji.
#
# Osobno bramka wygrywa z DR na każdej osi (`mask0p5`: −206,9 vs −140,0; czyste: −0,3 vs
# +6,1), więc jako ALTERNATYWA domain randomization jest zdominowany i nie ma o czym pisać.
# Pytanie brzmi inaczej: to są dwie RÓŻNE dźwignie — DR poprawia to, co polityka robi
# z popsutym odczytem, bramka w ogóle przestaje ten odczyt czytać. Po DR `mask0p5` = 592,5 s,
# czyli bramka ma tam jeszcze ~85 s zapasu nad FixedTime (507,0) — dokładnie tę lukę,
# której samą bramką nie domknąłeś („Otwarte" w §2b: reguła 525,7 vs FixedTime 507,0).
#
# KWADRAT (cztery kolumny uczone, wszystkie zamrożone, te same losowania awarii):
#
#                      | bez bramki             | z bramką-regułą
#   rdzeń czysty       | gatppo                 | gatppo_gate_rule
#   rdzeń z awariami   | gatppo_fail            | gatppo_fail_gate_rule
#
# TRZY ODCZYTY TEJ SAMEJ TABELI:
#   gatppo_gate_rule      vs gatppo       = ile daje sama bramka        (replikacja t2_gate_real)
#   gatppo_fail           vs gatppo       = ile daje sam DR             (nowy wynik z t2_train_uw)
#   gatppo_fail_gate_rule vs gatppo_fail  = ile daje bramka PONAD DR    ← to jest pytanie planu
#
# HIPOTEZY ZAPISANE PRZED POMIAREM:
#
#  H1 (składanie). Bramka na rdzeniu DR dowozi MNIEJ niż na rdzeniu czystym, bo obie
#     dźwignie naprawiają w dużej mierze tę samą szkodę — ale nie zero, bo DR zostawia
#     `mask0p5` 85 s nad FixedTime, a bramka właśnie tam ma największą przewagę. Zgadywany
#     zakres przy `mask0p5`: między −60 a −150 s wobec −206,9 s na rdzeniu czystym.
#     Wynik ROZSTRZYGAJĄCY to bezwzględne ATT kolumny 4 przy `mask0p5`: jeśli zejdzie
#     poniżej 507,0 s, złożenie jest JEDYNĄ konfiguracją w tej pracy, która bije FixedTime
#     w najgorszym scenariuszu, i to jest rekomendacja wdrożeniowa rozdziału 4.
#
#  H2 (czyste). Kolumna 4 na czystym ≈ kolumna 3 (czyli ~302 s, o ~6 s gorzej od rdzenia) —
#     bramka na czystym nie strzela. UWAGA, to NIE jest przesądzone: próg reguły jest
#     skalibrowany na zrzucie BC z Advanced-MP, ale ROZKŁAD STANÓW pod polityką DR jest
#     inny (dowód: +6,1 s na czystym), więc odsetek ruchów legalnie stojących mógł się
#     zmienić i budżet 0,5% fałszywych alarmów nie musi się utrzymać. Sprawdza to WPROST
#     diagnostyka `gate_share__clean`: na rdzeniu czystym wyszło 0,0146–0,0181. Jeśli na
#     kolumnie 4 wyjdzie ISTOTNIE więcej, próg nie przenosi się między politykami i trzeba
#     to napisać jako ograniczenie metody kalibracji, niezależnie od tego, co zrobi ATT.
#
#  H3 (szum). `gauss2` — kolumna 4 nie strzela ani razu, tak jak kolumna 2 (15/15 remisów
#     w `t2_gate_real`). Szum nie zamraża odczytu, a to jedyne, co reguła widzi. Jeśli
#     strzeli, znaczy że H2 poleciała i próg jest za nisko dla polityki DR.
#
# ZAKRES: JiNan, 3 seedy. HangZhou NIE — checkpointy DR są tylko dla JiNan (`p1_fail`
# grid = cityflow_jinan3x4_4ph × [0,1,2]). Replikacja na drugiej sieci wymagałaby 3 biegów
# GPU na gliderze i jest osobną decyzją, PO tym wyniku.
#
# KOSZT: 13 biegów (4 kolumny × 3 seedy + FixedTime), 8 splitów, 1 + 7×5 = 36 epizodów na
# bieg. Ewaluacja zamrożonych wag — CPU, laptop, ZERO treningu. Wszystkie checkpointy są
# lokalnie: runs/t1/gatppo__cityflow_jinan3x4_4ph__s{0,1,2}_y5/engine/core.pt (rdzeń czysty,
# bez sufiksu suite'a) oraz ...__s{0,1,2}_y5__p1_fail/engine/core.pt (rdzeń DR).
#
# PRÓG BRAMKI SIĘ NIE PRZELICZA i to jest celowe. `RuleGate` czyta wyłącznie wektor
# obserwacji (`window`, `threshold`, `n_mov`) — nie dotyka wag polityki — a próg bierze
# z `runs/heads/gate_ref__cityflow_jinan3x4_4ph.npz`, skalibrowanego na zrzucie BC
# z Advanced-MP. Jest więc niezależny od tego, który checkpoint siedzi pod spodem, i obie
# kolumny bramkowane dostają DOKŁADNIE ten sam detektor. Gdyby przeliczać go pod politykę
# DR, różnica kolumn 2 i 4 mieszałaby bramkę z jej rekalibracją.
#
# PUŁAPKA RAPORTU — PRZECZYTAJ PRZED URUCHOMIENIEM. `analysis/degradation.py::mechanism_pairs`
# emituje wiersz Δ tylko dla kolumn o rodzaju `policy_uw`/`policy_gate`. `gatppo_fail` jest
# gołym `policy`, więc mimo jawnego `baseline:` NIE TRAFI do tabeli „Mechanizm: … vs …" —
# dokładnie tak, jak w `t2_train_uw`, gdzie najmocniejsza liczba całego planu nie została
# policzona. Kolumny 2 i 4 policzą się same; wiersz „DR vs rdzeń czysty" trzeba do czasu
# poprawki `mechanism_pairs` policzyć osobno, parując po (scenariusz, seed, losowanie)
# z `runs/t2/*/metrics.csv`. `baseline:` zostaje tu wpisany mimo to — jest zwalidowany
# przez `load_plan` i będzie gotowy, gdy raport się tego nauczy.
#
# SCENARIUSZE: te same co `t2_gate_real` (tabele mają się czytać obok siebie), PLUS
# `mask0p5_intersection` — tam DR dał najwięcej (−206,2 s) i jako jedyny scenariusz zszedł
# pod FixedTime (483,8 vs 507,0), więc pytanie o składanie jest tam najostrzejsze. Zarazem
# to scenariusz SPOZA mieszanki treningowej `p1_fail` (mix ma `mask 0.25 unit:intersection`),
# czyli jedyne miejsce w tabeli, gdzie zysk DR jest czystą generalizacją po dotkliwości,
# a nie odtworzeniem rozkładu treningowego. Ten wiersz nosi ciężar dowodu.
#
# WYMAGA: runs/heads/gate_ref__cityflow_jinan3x4_4ph.npz (jest) oraz policzonego
# suite'a `p1_fail` (jest, 3 seedy).
name: t2_gate_dr
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph]

controllers:
  # 1. rdzeń trenowany na czystym — odniesienie całej tabeli. Rodzic domyślny, czyli
  #    `gatppo__<sieć>__s<seed>_y5` BEZ sufiksu suite'a — te same wagi, które mierzyły
  #    `t2_uw`, `t2_gate_real` i ramię 1 `t2_train_uw`.
  gatppo: {seeds: [0, 1, 2]}

  # 2. bramka na rdzeniu czystym. Replikacja kolumny z `t2_gate_real` WEWNĄTRZ tego planu,
  #    żeby porównanie „bramka na czystym vs bramka na DR" szło z jednego zestawu losowań,
  #    a nie przez dwie tabele. Baseline domyślny (`gatppo`) jest tu poprawny.
  gatppo_gate_rule:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, k_on: 3, k_off: 6}

  # 3. rdzeń trenowany z awariami, bez bramki (ramię 2 z `t2_train_uw`)
  gatppo_fail:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_fail"
    baseline: gatppo

  # 4. ZŁOŻENIE: bramka na rdzeniu trenowanym z awariami. Baseline JAWNY — domyśl
  #    („pierwsza kolumna `policy` tego samego agenta") trafiłby w `gatppo` i mierzył
  #    bramkę RAZEM z treningiem z awariami, czyli ten sam cichy błąd, przed którym
  #    `Plan.baseline` powstało w `t2_train_uw`. Tu ma wyjść SAM przyrost z bramki.
  gatppo_fail_gate_rule:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_fail"
    gate: {kind: rule, k_on: 3, k_off: 6}
    baseline: gatppo_fail

  # próg opłacalności: 507,0 s na JiNan. To wobec niego czyta się H1.
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 2.0}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
