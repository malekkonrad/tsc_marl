# TEST OF THE EPISTEMIC BRANCH of the two-level fallback (epistemic up on clean
# input -> MaxPressure). Gate 2.0: on lighter traffic the model does not lose
# accuracy, so this situation was absent from the data. Two questions here, see
# `analysis/ood.py`:
#   1. does the frozen policy LOSE to MaxPressure on traffic outside training,
#      especially HEAVIER traffic (the real HangZhou 5816 file: 6984 vehicles vs 2983, x2.3);
#   2. does the disagreement of 5 core actors (`gatppo_ens`) grow there MORE than under
#      detector noise; only then does it tell new traffic from a sensor failure.
#
# Weights ALWAYS from the training network: `{base}` = network name without the traffic
# variant suffix. Run AFTER seeds 3-4 are added (noc.sh): needs 5 seeds of the core and ACL.
name: t2_ood
mode: realistic
draws: 3
timeout: 14400   # heavy traffic computes slower: a 5816 episode has several times more vehicles

networks:
  - cityflow_jinan3x4_4ph          # training traffic (JiNan jams already at x1.1,
  - cityflow_jinan3x4_4ph_d0p25    #   so on JiNan only lighter traffic and another pattern)
  - cityflow_jinan3x4_4ph_r2000
  - cityflow_hangzhou4x4_4ph       # training traffic
  - cityflow_hangzhou4x4_4ph_r5816 # a real file, x2.3 vehicles; flowing: Efficient-MP 428 s
  # An artificial x1.5 (`tsc demand`) is OUT: duplicated traffic entries jam CityFlow (an
  # episode > 15 min instead of ~15 s), the same effect as JiNan x1.1. Hard traffic = real file only.

controllers:
  gatppo:
    seeds: [0, 1, 2, 3, 4]
    parent: "{agent}__{base}__s{seed}_y{yellow}"
  advancedcolight:
    seeds: [0, 1, 2, 3, 4]
    parent: "{agent}__{base}__s{seed}_y{yellow}"
  gatppo_ens:
    agent: gatppo
    ensemble: [0, 1, 2, 3, 4]      # seed 0 decides, the others vote
    parent: "{agent}__{base}__s{seed}_y{yellow}"
  efficientmp: {}
  advancedmp: {}
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 2.0}      # reference point: the ensemble's reaction to a sensor failure
