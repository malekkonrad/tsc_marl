# TEST GAŁĘZI EPISTEMIC dwupoziomowego fallbacku (epistemic↑ przy czystym wejściu →
# MaxPressure). Bramka 2.0: na lżejszym ruchu model nie traci trafności, więc tej
# sytuacji w danych nie było. Tu dwa pytania, patrz `analysis/ood.py`:
#   1. czy zamrożona polityka PRZEGRYWA z MaxPressure na ruchu spoza treningu,
#      zwłaszcza CIĘŻSZYM (realny plik HangZhou 5816: 6984 pojazdów vs 2983, ×2,3);
#   2. czy rozbieżność 5 actorów rdzenia (`gatppo_ens`) rośnie tam MOCNIEJ niż na
#      szumie detektorów — tylko wtedy odróżnia nowy ruch od awarii sensora.
#
# Wagi ZAWSZE z sieci treningowej: `{base}` = nazwa sieci bez sufiksu wariantu ruchu.
# Uruchamiać PO dograniu seedów 3–4 (noc.sh) — potrzebuje 5 seedów rdzenia i ACL.
name: t2_ood
mode: realistic
draws: 3
timeout: 14400   # ciężki ruch liczy się wolniej — epizod 5816 to kilka razy więcej pojazdów

networks:
  - cityflow_jinan3x4_4ph          # ruch treningowy (JiNan korkuje się już przy ×1,1,
  - cityflow_jinan3x4_4ph_d0p25    #   więc na JiNan tylko lżejszy i inny wzorzec)
  - cityflow_jinan3x4_4ph_r2000
  - cityflow_hangzhou4x4_4ph       # ruch treningowy
  - cityflow_hangzhou4x4_4ph_r5816 # realny plik, ×2,3 pojazdów; płynny: Efficient-MP 428 s
  # Sztuczne ×1,5 (`tsc demand`) ODPADA: zdublowane wpisy ruchu korkują CityFlow (epizod
  # > 15 min zamiast ~15 s) — ten sam efekt co JiNan ×1,1. Trudny ruch = tylko realny plik.

controllers:
  gatppo:
    seeds: [0, 1, 2, 3, 4]
    parent: "{agent}__{base}__s{seed}_y{yellow}"
  advancedcolight:
    seeds: [0, 1, 2, 3, 4]
    parent: "{agent}__{base}__s{seed}_y{yellow}"
  gatppo_ens:
    agent: gatppo
    ensemble: [0, 1, 2, 3, 4]      # decyduje seed 0, pozostałe głosują
    parent: "{agent}__{base}__s{seed}_y{yellow}"
  efficientmp: {}
  advancedmp: {}
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 2.0}      # punkt odniesienia: reakcja ensemble na awarię sensora
