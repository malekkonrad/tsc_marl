# GATE TRACE FOR A FIGURE: a plan existing ONLY to produce `gate_trace.csv` for the
# explanatory figure (Phase 4, explainability).
#
# WARNING: DO NOT CITE ANY ATT FROM THIS PLAN. One seed and one failure draw per
# scenario: figure material, not a measurement. Numbers for the thesis come from
# `t2_gate_real` (3 seeds x 5 draws) and only from it.
#
# WHY A SEPARATE PLAN rather than `--trace` on `t2_gate_real`: the trace is ~240
# decisions x N nodes x scenarios x draws. On the full plan that is data nobody asked
# for, and recomputing `t2_gate_real` with `--replace` would replace the results cited
# in section 2b. A separate `run_id` (`__t2_trace`) touches nothing computed.
#
# RUN (the flag is CLI, not a plan key, see `GatedController.trace`):
#     tsc degrade run t2_trace --trace -j 4
#
# SCENARIOS chosen so the figure shows THREE different gate behaviours:
#   clean                  - almost never fires (gate_share 1.6%): the "no failure" background
#   gauss2                 - DOES NOT FIRE ONCE (section 8.3): proof that noise does not freeze
#                            a reading; an empty bar in the figure, and that is the content
#   mask0p25_intersection  - precision 0.89: a clean takeover of WHOLE intersections,
#                            the clearest case of "why THIS node"
#   mask0p5                - precision 0.73 at a 57% share: a blurred case showing
#                            hysteresis and scores just below the threshold
#   mask0p25_hold_t60      - failure FROM DECISION 60: the figure shows the detection
#                            DELAY (the 12-step window must fill with frozen readings)
name: t2_trace
mode: realistic
draws: 1
timeout: 3600

networks: [cityflow_jinan3x4_4ph]

controllers:
  gatppo_gate_rule:
    agent: gatppo
    seeds: [0]
    gate: {kind: rule, k_on: 3, k_off: 6}

scenarios:
  - {kind: gauss, level: 2.0}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
