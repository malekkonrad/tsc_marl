# T2 for the policy TRAINED with the mechanism: the three arms of section 3 of the
# Phase 3 note.
#
# Columns (all frozen, the same evaluation loop, the same failure draws):
#
#   gatppo           core trained on CLEAN            parent: p1_gate
#   gatppo_fail      core trained WITH FAILURES       parent: p1_fail
#   gatppo_fail_uw   core with failures AND UW        parent: p1_uw
#   fixedtime        fallback break-even threshold
#
# HERE THE DIFFERENCES DO NOT COME FROM ONE CHECKPOINT, the only thing that sets this
# plan apart from `t2_uw`. There the modulation had no parameters, so two columns were
# computed from the same weights and the comparison was paired on the mechanism ALONE.
# Here each arm has its own training, so pairing is by (network, scenario, seed, draw):
# the failure draw and the traffic stay shared, and the between-seed spread enters the
# difference. Hence the same number of seeds in every column, and hence an EXPLICIT
# `baseline:`: by default the report would pair `gatppo_fail_uw` with the first `policy`
# column, arm 1, which would measure "failure training + mechanism" together.
#
# TWO READINGS OF THE SAME TABLE:
#   arm 2 vs arm 1  = what failure training alone gives (domain randomization),
#   arm 3 vs arm 2  = what the MECHANISM adds on top. This is the result of this work.
#
# REQUIRES: computed suites `p1_fail` and `p1_uw` (weights only on the GPU machine) and
# head artefacts for every network of the plan:
#   tsc obshead -n <network> --save --window 12 --persistence
#
# Scenarios DELIBERATELY the same as in `t2_uw`: the tables of both plans are to be read
# side by side, and hypothesis A3b (the mechanism helps under noise and PARTIAL masks,
# not for a whole dead intersection) is recorded for this set.
name: t2_train_uw
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}
  gatppo_fail:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_fail"
    # The "arm 2 vs arm 1" reading from this plan's header MUST BE IN THE REPORT, not
    # computed by hand. Added after the first pass: without this line the column is a
    # plain `policy` and reached no delta table, so -140.0 s at `mask0p5`
    # (t = -10.8, better in 15/15) appeared nowhere in `t2_train_uw.md`.
    baseline: gatppo
  gatppo_fail_uw:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_uw"
    # The mechanism MUST be on at evaluation too: the policy learned with it, so without
    # it we would measure a network deprived of part of its own input.
    # tau the same as in training (`configs/suites/p1_uw.yml`).
    uw: {tau: 0.25}
    baseline: gatppo_fail
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
