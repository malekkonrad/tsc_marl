# T2 dla polityki TRENOWANEJ z mechanizmem — trzy ramiona z §3 notatki Fazy 3.
#
# Kolumny (wszystkie zamrożone, ta sama pętla ewaluacji, te same losowania awarii):
#
#   gatppo           rdzeń trenowany na CZYSTYM        rodzic: p1_gate
#   gatppo_fail      rdzeń trenowany Z AWARIAMI        rodzic: p1_fail
#   gatppo_fail_uw   rdzeń z awariami I Z UW-attention rodzic: p1_uw
#   fixedtime        próg opłacalności fallbacku
#
# TU RÓŻNICE NIE SĄ Z JEDNEGO CHECKPOINTU — i to jest jedyna rzecz, która odróżnia ten
# plan od `t2_uw`. Tam modulacja była bezparametrowa, więc dwie kolumny liczyły się
# z tych samych wag i porównanie było parowane po SAMYM mechanizmie. Tutaj każde ramię
# ma własny trening, więc parujemy po (sieć, scenariusz, seed, losowanie) — wspólne
# zostają losowanie awarii i ruch, a rozrzut między seedami wchodzi do różnicy.
# Dlatego seedów ma być tyle samo w każdej kolumnie i dlatego `baseline:` jest tu
# JAWNY: raport domyślnie sparowałby `gatppo_fail_uw` z pierwszą kolumną `policy`,
# czyli z ramieniem 1 — a to mierzyłoby „trening z awariami + mechanizm" razem.
#
# DWA ODCZYTY TEJ SAMEJ TABELI:
#   ramię 2 vs ramię 1  = ile daje sam trening z awariami (domain randomization),
#   ramię 3 vs ramię 2  = ile daje MECHANIZM ponad to. To jest wynik tej pracy.
#
# WYMAGA: policzonych suite'ów `p1_fail` i `p1_uw` (wagi tylko na gliderze) oraz
# artefaktów głowy dla każdej sieci planu:
#   tsc obshead -n <sieć> --save --window 12 --persistence
#
# Scenariusze CELOWO te same co w `t2_uw` — tabele obu planów mają się czytać obok
# siebie, a hipoteza A3b (mechanizm pomaga przy szumie i CZĘŚCIOWYCH maskach, nie przy
# martwym całym skrzyżowaniu) jest zapisana dla tego zestawu.
name: t2_train_uw
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}
  gatppo_fail:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_fail"
  gatppo_fail_uw:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_uw"
    # Mechanizm MUSI być włączony także w ewaluacji — polityka uczyła się z nim,
    # więc bez niego mierzylibyśmy sieć pozbawioną części własnego wejścia.
    # τ to samo co w treningu (`configs/suites/p1_uw.yml`).
    uw: {tau: 0.25}
    baseline: gatppo_fail
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
