# T2 for UW-attention: does weighting neighbours by reading reliability help under failure.
#
# Three columns: the core, the core + UW-attention, FixedTime. The first two are computed
# FROM THE SAME CHECKPOINT (the same `parent`, the modulation has no parameters), so the
# difference between them is the mechanism alone, not another training or seed.
#
# HYPOTHESIS RECORDED BEFORE MEASUREMENT (Appendix A3b): UW-attention helps under noise
# and under PARTIAL masks (one neighbour broken, the rest healthy), and does NOT help
# for a whole dead intersection: there all inbound edges are equally uncertain and
# softmax is invariant to a shared constant (`test_invariance_to_a_common_constant`).
# That is why the `unit: intersection` scenarios stay in the plan: they should come out zero.
#
# What NOT to expect: the observation head does not detect drift (AUROC 0.536,
# results/gate_2_2.md), so under `drift` the modulation moves weights largely at
# random. That should also show in the table.
#
# Diagnostics in the rows: `uw_spread` (the log rho spread within a softmax group, the
# only part of the signal attention sees) and `uw_active`. Without them an empty result
# is indistinguishable from a mechanism that stayed silent the whole episode.
#
# REQUIRES head artefacts for EVERY network of the plan:
#   tsc obshead -n <network> --save --window 12 --persistence
name: t2_uw
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2, 3, 4]}
  gatppo_uw:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25}
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
