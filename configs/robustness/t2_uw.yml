# T2 dla UW-attention — czy ważenie sąsiadów wiarygodnością odczytu pomaga pod awarią.
#
# Trzy kolumny: rdzeń, rdzeń + UW-attention, FixedTime. Pierwsze dwie liczą się
# Z TEGO SAMEGO CHECKPOINTU (`parent` ten sam, modulacja jest bezparametrowa), więc
# różnica między nimi to wyłącznie mechanizm — nie inny trening, nie inny seed.
#
# HIPOTEZA ZAPISANA PRZED POMIAREM (Załącznik A3b): UW-attention pomaga przy szumie
# i przy CZĘŚCIOWYCH maskach (jeden sąsiad zepsuty, reszta zdrowa), a NIE pomaga przy
# martwym całym skrzyżowaniu — tam wszystkie krawędzie wchodzące są równie niepewne,
# a softmax jest na wspólną stałą niezmienniczy (`test_niezmiennicosc_na_wspolna_stala`).
# Dlatego scenariusze `unit: intersection` zostają w planie: mają wyjść na zero.
#
# Czego się NIE spodziewać: głowa obserwacyjna nie wykrywa dryfu (AUROC 0,536,
# results/gate_2_2.md), więc na `drift` modulacja rusza wagami w dużej mierze
# przypadkowo. To też ma być widać w tabeli.
#
# Diagnostyka w wierszach: `uw_spread` (rozstęp log ρ w grupie softmaxu — jedyna
# część sygnału, którą attention widzi) i `uw_active`. Bez nich pusty wynik jest
# nieodróżnialny od mechanizmu, który przez cały epizod milczał.
#
# WYMAGA artefaktów głowy dla KAŻDEJ sieci planu:
#   tsc obshead -n <sieć> --save --window 12 --persistence
name: t2_uw
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2, 3, 4]}
  gatppo_uw:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25}
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
