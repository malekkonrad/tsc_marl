# T2 for the REAL GATE: how much of the oracle ceiling a signal computable from readings collects.
#
# The oracle (`t2_gate`) showed the headroom: -120 s at `mask0p25_intersection`, -242 s at
# `mask0p5`, -403 s at `mask0p75`, with zero harm on clean. But it reads the truth from the
# failure layer, so it is not a controller. This plan measures two DEPLOYABLE gates against
# that ceiling:
#
#   rule - the fraction of a node's movements whose readings stand still over the whole
#          window. A frozen detector counter; it catches `zero` and `hold` with one criterion.
#   uq   - the fraction of movements whose u exceeds their own norm from the clean window
#          (the observation head, artefacts from `runs/heads/`).
#
# THIS IS THE ABLATION THAT DECIDES ABOUT THE UNCERTAINTY HEAD IN THE WHOLE THESIS.
# UW-attention did not justify its existence (results/t2_uw.md: the mechanism worked, ATT
# neutral). If the freeze counter gates equally well, the conclusion reads "reading
# persistence is enough to detect a dead detector" and it must be written that way.
#
# BOTH SIGNALS HAVE THE SAME FORM (fraction of suspicious movements) and thresholds
# calibrated by THE SAME criterion on the clean window of the BC dataset: <=0.5% of
# decisions with a false switch (`GATE_FALSE_ALARM`). Otherwise we would compare readiness
# to fire rather than signal quality. The thresholds live in the artefact
# `runs/heads/gate_ref__<network>.npz`, not in this file; the plan does not override them.
#
# HYPOTHESES RECORDED BEFORE MEASUREMENT (based on the BC dataset, not T2):
#  1. `zero` masks: the rule close to the oracle (switch rate 52.6% vs 62% at mask0p5,
#     25.0% vs 27% at mask0p25_intersection). UQ much weaker (14.8%).
#  2. `hold`: the rule should hold (freezing is its criterion), but with a DELAY of up to
#     12 decisions, the time to fill the window. The oracle switches at once, so the ATT
#     difference measures the cost of that delay.
#  3. `gauss`: UQ IS EXPECTED TO ERR MASSIVELY THERE. sigma grows under noise, where the
#     detectors are alive and the policy beats FixedTime (319 s vs 507 s). On the BC dataset:
#     88% of decisions above threshold at gauss2, against 0% for the rule. The `gauss`
#     scenarios are in the plan PRECISELY so this failure mode shows, not to avoid it.
#
# HYSTERESIS (k_on/k_off) applies to real gates only; the oracle's signal is constant
# within an episode. It enters the run fingerprint, so changing it invalidates the result.
#
# The `gate_precision` / `gate_recall` DIAGNOSTICS are computed against the oracle with
# threshold `oracle_threshold` (0.5 by default = "half of the node's approaches dead"). This
# is the DEFINITION of blinding used to assess the detector and is independent of the
# threshold the oracle column works at (0.75). A stricter threshold gave an empty set under
# lane masks and both metrics became undefined. The truth from the failure layer does NOT
# touch decisions.
#
# HANGZHOU, a prediction recorded BEFORE the run: the rule threshold calibrated there to
# 0.875 (7 of 8 movements frozen) against 0.25 on JiNan. Reason: on HangZhou's clean window
# many movements legitimately stand still (less traffic per movement), so the 99.5% quantile
# lands high. The gate will be MUCH more conservative there: it should catch dead
# intersections (all 8 movements frozen) and stay silent under lane masks. If so, it is a
# property of calibrating "on clean", not a detector defect, and it shows how much of this
# method depends on the network's traffic density.
#
# REQUIRES: tsc obshead -n <network> --save --window 12 --persistence
name: t2_gate_real
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}
  gatppo_gate_rule:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, k_on: 3, k_off: 6}
  gatppo_gate_uq:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: uq, k_on: 3, k_off: 6}
  gatppo_gate_oracle:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: oracle, threshold: 0.75}
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 2.0}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
