# T2 for the AGGREGATION ABLATIONS: does the core's advantage under failure come from
# attention.
#
# On clean traffic the actor without neighbours and mean-pool are 0.3-1.3% BETTER than
# GAT (results/p1_ablations.md), while under dead intersections the core degrades much
# more gently than Advanced-CoLight (results/t2_nomech.md). This plan decides whether
# that is due to neighbour weighting: the same scenarios as t2_nomech, three actor
# variants, the same seeds. Hypothesis from open-questions.md: the GNN wins precisely
# under sensor failure, not on a clean small grid.
name: t2_ablations
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2, 3, 4]}
  # `baseline:` added 2026-09-20. The ablation columns are separate TRAININGS, so
  # without it the report gave only +-std, and a +-std table at `mask0p25_intersection`
  # (sd of 90-200 s) cannot tell an effect from noise. The same trap the Phase 3 note
  # describes for `mask0p25_hold_t60`. delta < 0 = the ABLATION is better, i.e.
  # attention/GNN is WORSE: the assessed column is the variant, the reference the core.
  gatppo_mean:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_abl_meanpool"
    baseline: gatppo
  gatppo_nognn:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_abl_nognn"
    baseline: gatppo
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
