# T2 dla ABLACJI AGREGACJI — czy przewaga rdzenia pod awarią pochodzi z attention.
#
# Na czystym ruchu actor bez sąsiadów i mean-pool są o 0,3–1,3% LEPSZE od GAT
# (results/p1_ablations.md), a pod martwymi skrzyżowaniami rdzeń degraduje się
# dużo łagodniej niż Advanced-CoLight (results/t2_nomech.md). Ten plan rozstrzyga,
# czy to zasługa ważenia sąsiadów: te same scenariusze co t2_nomech, trzy warianty
# actora, te same seedy. Hipoteza z open-questions.md: GNN wygrywa właśnie pod
# awarią sensora, nie na czystej małej siatce.
name: t2_ablations
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2, 3, 4]}
  gatppo_mean:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_abl_meanpool"
  gatppo_nognn:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_abl_nognn"
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
