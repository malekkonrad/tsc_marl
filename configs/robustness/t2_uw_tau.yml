# tau SWEEP for UW-attention: cheap insurance for a negative result.
#
# `results/t2_uw.md` concluded that the modulation is neutral for ATT at tau = 0.25.
# This plan closes the only cheap question that raises: "maybe you just picked tau
# badly". It is not an attempt to rescue the mechanism, but proof that the result does
# not depend on one number.
#
# tau converts the uncertainty EXCESS to nats in the logit: log rho = -relu(u - u_ref)/tau.
# LOWER tau = STRONGER modulation. The chosen 0.25 gave a mean log rho spread within a
# softmax group of 6.12 nats at `gauss4` (best and worst neighbour differed ~450x) and
# ATT did not move. This plan goes towards EVEN stronger:
#
#   0.25 - the value of `obs_head.DEFAULT_TAU`, the anchoring column (recomputed in this
#          plan, so the comparison stays within one set of draws);
#   0.10 - 2.5x stronger;
#   0.05 - 5x stronger, i.e. at `gauss4` a spread of ~30 nats: a neighbour judged
#          unreliable is switched off PRACTICALLY COMPLETELY.
#
# HYPOTHESIS RECORDED BEFORE MEASUREMENT: no tau changes the verdict, and at 0.05 HARM
# may appear, since the mechanism starts switching neighbours off based on a signal
# with AUROC 0.65 under masks that does not work at all on HangZhou. If so, it is a
# stronger version of the conclusion: the problem is not the strength of the
# modulation but the quality of the signal it modulates with.
#
# The columns are computed from THE SAME checkpoint as the core (the modulation has no
# parameters), so differences are paired. tau enters the run fingerprint
# (`MECHANISM_KEYS`); without it three columns would share a fingerprint and two would
# be skipped as "has a result".
#
# SCOPE: JiNan, 3 seeds. HangZhou left out deliberately: there the head does not detect
# masks (`uw_spread` under masks BELOW the clean level), so a sweep of modulation
# strength would measure noise scaling there.
#
# REQUIRES: runs/heads/{obs_head,u_ref}__cityflow_jinan3x4_4ph.*
name: t2_uw_tau
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}
  gatppo_uw_t0p25:
    agent: gatppo
    seeds: [0, 1, 2]
    uw: {tau: 0.25}
  gatppo_uw_t0p10:
    agent: gatppo
    seeds: [0, 1, 2]
    uw: {tau: 0.10}
  gatppo_uw_t0p05:
    agent: gatppo
    seeds: [0, 1, 2]
    uw: {tau: 0.05}
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
