# SWEEP τ dla UW-attention — tania asekuracja przy wyniku negatywnym.
#
# `results/t2_uw.md` orzekło, że modulacja jest wobec ATT neutralna przy τ = 0,25.
# Ten plan zamyka jedyne tanie pytanie, jakie się na to nasuwa: „a może po prostu
# źle dobrałeś τ". Nie jest próbą uratowania mechanizmu — jest dowodem, że wynik
# nie zależy od jednej liczby.
#
# τ przelicza NADMIAR niepewności na naty w logicie: log ρ = −relu(u − u_ref)/τ.
# NIŻSZE τ = SILNIEJSZA modulacja. Dobrane 0,25 dawało przy `gauss4` średni rozstęp
# log ρ w grupie softmaxu 6,12 nata (najlepszy i najgorszy sąsiad różnili się ~450×)
# i ATT nie drgnęło. Ten plan idzie w stronę JESZCZE silniejszą:
#
#   0,25 — wartość z `obs_head.DEFAULT_TAU`, kolumna kotwicząca (przeliczona w tym
#          planie od nowa, żeby porównanie było wewnątrz jednego zestawu losowań);
#   0,10 — 2,5× silniejsza;
#   0,05 — 5× silniejsza, czyli przy `gauss4` rozstęp rzędu 30 natów: sąsiad uznany
#          za niewiarygodnego jest wygaszony PRAKTYCZNIE CAŁKOWICIE.
#
# HIPOTEZA ZAPISANA PRZED POMIAREM: żadne τ nie zmienia werdyktu, a przy 0,05 może
# pojawić się SZKODA — bo mechanizm zacznie wygaszać sąsiadów na podstawie sygnału,
# który przy maskach ma AUROC 0,65, a na HangZhou nie działa wcale. Jeśli tak wyjdzie,
# jest to mocniejsza wersja wniosku: problemem nie jest siła modulacji, tylko jakość
# sygnału, którym się moduluje.
#
# Kolumny liczą się z TEGO SAMEGO checkpointu co rdzeń (modulacja bezparametrowa),
# więc różnice są parowane. τ wchodzi do odcisku biegu (`MECHANISM_KEYS`) — bez tego
# trzy kolumny miałyby ten sam odcisk i dwie zostałyby pominięte jako „jest wynik".
#
# ZAKRES: JiNan, 3 seedy. HangZhou pominięte świadomie — tam głowa nie wykrywa masek
# (`uw_spread` przy maskach PONIŻEJ poziomu z czystego), więc sweep siły modulacji
# mierzyłby tam skalowanie szumu.
#
# WYMAGA: runs/heads/{obs_head,u_ref}__cityflow_jinan3x4_4ph.*
name: t2_uw_tau
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}
  gatppo_uw_t0p25:
    agent: gatppo
    seeds: [0, 1, 2]
    uw: {tau: 0.25}
  gatppo_uw_t0p10:
    agent: gatppo
    seeds: [0, 1, 2]
    uw: {tau: 0.10}
  gatppo_uw_t0p05:
    agent: gatppo
    seeds: [0, 1, 2]
    uw: {tau: 0.05}
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
