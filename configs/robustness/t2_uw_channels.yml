# T2 — ABLACJA KANAŁÓW UW-attention: którędy płynie zysk modulacji.
#
# SKĄD TEN PLAN. `t2_uw_rule` (results/t2_uw_rule.md) dał dwa wyniki naraz:
#   - UW z wyrocznią/regułą DZIAŁA samodzielnie (JiNan `mask0p5_int` −167 / −122 s),
#   - złożone z bramką fallbacku NIE DAJE NIC przy maskach skrzyżowań, nawet gdy obie
#     strony są wyroczniami (+0,1 / +0,3 / −0,1 / −0,2 s).
# Wyjaśnienie zapisane w C5 (`kontrybucje.md`): modulacja po stronie źródła działa
# dwoma kanałami — PĘTLĄ WŁASNĄ (martwy węzeł przestaje ufać swojej obserwacji
# i opiera się na sąsiadach) i KRAWĘDZIAMI (sąsiedzi przestają ufać jego wiadomości).
# Bramka zabiera akcję martwego węzła, więc pętla własna traci znaczenie; zero
# złożenia oznaczałoby, że kanał krawędzi jest wart ~0, a cały zysk szedł pętlą.
# To jest jednak WNIOSKOWANIE Z RÓŻNICY DWÓCH PAR, nie pomiar. Ten plan mierzy wprost.
#
# KONSTRUKCJA. `channels` w `uw` zeruje jedną z dwóch części wektora log ρ
# (`controllers.source_log_rho`). Części są ROZŁĄCZNE i sumują się do pełnej
# modulacji, więc ablacja rozkłada zysk dokładnie. Wyrocznia, nie reguła: pytanie
# dotyczy MECHANIZMU, a wyrocznia nie ma rozgrzewki ani fałszywych alarmów — każda
# różnica między kolumnami to wyłącznie kanał. Wszystkie kolumny z tego samego
# checkpointu, ten sam zestaw losowań, n = 5.
#
#   gatppo                    rdzeń (odniesienie wszystkich par)
#   gatppo_uw_oracle          oba kanały — powtórka `t2_uw_src` w tym zestawie losowań
#   gatppo_uw_oracle_self     tylko pętle własne
#   gatppo_uw_oracle_edges    tylko krawędzie między węzłami
#
# SCENARIUSZE: tylko te, w których wyrocznia w ogóle widzi awarię. Na `gauss*`
# i `drift*` u ≡ 0 z definicji (brak martwych pasów) — ich wiersze byłyby kopią
# rdzenia i tylko podnosiłyby liczbę porównań przy progu |t| ≥ 2,8.
#
# HIPOTEZY ZAPISANE PRZED POMIAREM:
#   K1 (główna): przy `mask*_intersection` `self` ≈ `all` na obu sieciach — Δ vs rdzeń
#      co najmniej 80% pełnej modulacji, różnica między nimi poniżej progu.
#   K2: przy `mask*_intersection` `edges` bez istotnego zysku vs rdzeń.
#   K3 (maski pasowe, `mask0p5`): też głównie pętla — przy częściowo oślepionym
#      węźle jego własne odczyty są w połowie zdrowe, więc oczekiwany zysk `self`
#      mniejszy niż przy martwym skrzyżowaniu, ale znak ten sam. `edges` ~0.
#   K4 (`hold`): wszystkie trzy ~0 — pełna modulacja była tam na zerze (`t2_uw_src`).
#   Odczyt:
#   - K1 + K2 → zdanie z C5 („zysk UW idzie przez pętlę własną, ochrona sąsiadów jest
#     warta ~0") przestaje być wnioskowaniem i może stać w abstrakcie.
#   - `edges` istotne samo, a złożenie z bramką i tak 0 → kanał sąsiadów ISTNIEJE,
#     tylko bramka go zastępuje (np. sąsiedzi tracą przez złe AKCJE martwego węzła,
#     a nie przez jego wiadomości). C5 do korekty: redundancja zostaje, mechanizm inny.
#   - `self` i `edges` osobno słabe, razem silne → kanały współdziałają; rozkład
#     zysku nie jest addytywny i zdanie o „samej pętli" trzeba wycofać.
#
# WYMAGA: nic poza checkpointami rdzenia (wyrocznia nie używa artefaktów głowy).
name: t2_uw_channels
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2, 3, 4]}
  gatppo_uw_oracle:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source, u: oracle}
  gatppo_uw_oracle_self:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source, u: oracle, channels: self}
  gatppo_uw_oracle_edges:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source, u: oracle, channels: edges}
  fixedtime: {}

scenarios:
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
