# T2: UW-attention CHANNEL ABLATION: which way the modulation's gain flows.
#
# WHERE THIS PLAN COMES FROM. `t2_uw_rule` (results/t2_uw_rule.md) gave two results at once:
#   - UW with the oracle/rule WORKS on its own (JiNan `mask0p5_int` -167 / -122 s),
#   - composed with the fallback gate it GIVES NOTHING under intersection masks, even when
#     both sides are oracles (+0.1 / +0.3 / -0.1 / -0.2 s).
# The explanation recorded in C5 (`kontrybucje.md`): source-side modulation works through
# two channels, the SELF LOOP (a dead node stops trusting its own observation and leans on
# its neighbours) and the EDGES (neighbours stop trusting its message). The gate takes
# away the dead node's action, so the self loop loses its meaning; a zero for the
# composition would mean the edge channel is worth ~0 and the whole gain went through
# the loop. That is, however, INFERENCE FROM THE DIFFERENCE OF TWO PAIRS, not a
# measurement. This plan measures it directly.
#
# CONSTRUCTION. `channels` in `uw` zeroes one of the two parts of the log rho vector
# (`controllers.source_log_rho`). The parts are DISJOINT and sum to the full modulation,
# so the ablation decomposes the gain exactly. The oracle, not the rule: the question is
# about the MECHANISM, and the oracle has no warm-up or false alarms, so every difference
# between columns is the channel alone. All columns from the same checkpoint, the same
# set of draws, n = 5.
#
#   gatppo                    core (reference of every pair)
#   gatppo_uw_oracle          both channels, a repeat of `t2_uw_src` on this set of draws
#   gatppo_uw_oracle_self     self loops only
#   gatppo_uw_oracle_edges    edges between nodes only
#
# SCENARIOS: only those in which the oracle sees a failure at all. Under `gauss*` and
# `drift*` u = 0 by definition (no dead lanes); their rows would copy the core and only
# raise the number of comparisons at the |t| >= 2.8 threshold.
#
# HYPOTHESES RECORDED BEFORE MEASUREMENT:
#   K1 (main): at `mask*_intersection` `self` ~ `all` on both networks: delta vs the core
#      at least 80% of the full modulation, the difference between them below threshold.
#   K2: at `mask*_intersection` `edges` without a significant gain vs the core.
#   K3 (lane masks, `mask0p5`): also mainly the loop; with a partly blinded node its own
#      readings are half healthy, so the expected `self` gain is smaller than for a dead
#      intersection, but of the same sign. `edges` ~0.
#   K4 (`hold`): all three ~0; the full modulation was at zero there (`t2_uw_src`).
#   Reading:
#   - K1 + K2 -> the C5 statement ("the UW gain goes through the self loop, protecting
#     neighbours is worth ~0") stops being inference and can stand in the abstract.
#   - `edges` significant alone while the composition with the gate is still 0 -> the
#     neighbour channel EXISTS, only the gate replaces it (e.g. neighbours lose through the
#     dead node's bad ACTIONS rather than its messages). C5 to correct: the redundancy
#     stays, the mechanism differs.
#   - `self` and `edges` weak apart, strong together -> the channels interact; the gain
#     decomposition is not additive and the "loop alone" statement must be withdrawn.
#
# REQUIRES: nothing beyond the core checkpoints (the oracle uses no head artefacts).
name: t2_uw_channels
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2, 3, 4]}
  gatppo_uw_oracle:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source, u: oracle}
  gatppo_uw_oracle_self:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source, u: oracle, channels: self}
  gatppo_uw_oracle_edges:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source, u: oracle, channels: edges}
  fixedtime: {}

scenarios:
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
