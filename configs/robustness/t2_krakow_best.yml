# T2, Krakow: is the loss to Webster due to the checkpoint choice or the policy's capability?
#
# WHERE FROM. In `t2_krakow` the policy (final checkpoint) lost to FixedTime-Webster already
# on clean `mid`: 344 / 356 / 429 s per seed against 347.6. But the test episodes late in
# training jumped within ~340-430 s, and `att_best` (320-338 s) lay BELOW Webster. The final
# checkpoint is thus a random sample from the noisy end of training.
#
# THE TRAP THIS PLAN AVOIDS. A training test episode is exactly clean `mid` in
# `tsc degrade` (agreement 0.000 s), so the best checkpoint chosen on the test has a clean
# `mid` result equal to `att_best`, by definition. That would be selection on the
# measurement set. The measure is therefore the HELD-OUT traffic `sumo_krakow3w_mid_s1`:
# the same demand level (4500 veh/h), routes with seed 1, its own Webster and its own rule
# threshold. Training never saw it. On `mid` the plan runs for control only (it shows the
# size of the selection optimism).
#
# COLUMNS (parents `k2_core` / `k2_fail`, repeats of `k1_*` with `model.save_best`):
#   gatppo / gatppo_best             core: final vs best checkpoint
#   gatppo_fail / gatppo_fail_best   DR: final vs best
#   gatppo_fail_gate_best            DR (best) + rule gate, the solution
#   advancedmp, fixedtime (Webster)
#
# HYPOTHESES RECORDED BEFORE MEASUREMENT (on `mid_s1`):
#   B1: on clean the best checkpoint <= the final one (mean over seeds) with a smaller spread
#       between seeds; selection removes a tail like 429 s.
#   B2 (DECISIVE): best checkpoint on clean vs Webster. No conviction about the sign:
#       `att_best` was 3-8% below Webster, but that is optimistic (the maximum of 200 noisy
#       trials on the same episode); on held-out traffic the advantage may vanish.
#       Reading: policy <= Webster -> the loss in `t2_krakow` was an artefact of checkpoint
#       choice; policy > Webster -> the loss is real and the statement in the thesis stays.
#   B3: under `mask0p5_intersection` DR + gate ~ its own clean result (as in `t2_krakow`).
#   B4 (optimism control): on `mid` the best checkpoint looks better than on `mid_s1` by more
#       than the final one does; the difference is the size of the selection bias.
#
# REQUIRES: suites `k2_core`, `k2_fail` (GPU machine) and `rule_ref__sumo_krakow3w_mid_s1.json`
# and `rule_ref__sumo_krakow3w_mid.json` (`tsc rulecal`, rsync from the laptop).
name: t2_krakow_best
mode: realistic
draws: 3
timeout: 14400

networks: [sumo_krakow3w_mid_s1, sumo_krakow3w_mid]

controllers:
  gatppo:
    seeds: [0, 1, 2]
    parent: "{agent}__sumo_krakow3w_mid__s{seed}_y{yellow}__k2_core"
    label: core (final)
  gatppo_best:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__sumo_krakow3w_mid__s{seed}_y{yellow}__k2_core"
    checkpoint: best
    label: core (best)
    baseline: gatppo
  gatppo_fail:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__sumo_krakow3w_mid__s{seed}_y{yellow}__k2_fail"
    label: DR (final)
  gatppo_fail_best:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__sumo_krakow3w_mid__s{seed}_y{yellow}__k2_fail"
    checkpoint: best
    label: DR (best)
    baseline: gatppo_fail
  gatppo_fail_gate_best:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__sumo_krakow3w_mid__s{seed}_y{yellow}__k2_fail"
    checkpoint: best
    gate: {kind: rule, k_on: 3, k_off: 6}
    label: DR (best) + rule gate
    baseline: gatppo_fail_best
  advancedmp: {}
  fixedtime: {}

scenarios:
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.5, unit: intersection}
