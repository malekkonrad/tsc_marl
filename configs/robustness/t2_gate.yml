# T2 for the FALLBACK GATE: the minimal version, with an ORACLE gate.
#
# The question of this plan: how much can be gained with PERFECT detection. The oracle
# reads the truth from the failure layer (`sensors.broken`), so it is not a deployable
# controller but an UPPER BOUND for real gates (the rule from Step 8, UQ from Step 9). If
# there is no gain here, no detector can conjure one and there is no point building it.
#
# WHY FIXEDTIME and not MaxPressure: under heavy masks everything that reads the detectors
# is worse than FixedTime (results/t2_nomech.md, JiNan mask0p5: core 743, Efficient-MP 648,
# Advanced-MP 750, FixedTime 507). Robustness here comes from NOT READING broken data.
# MaxPressure stays for the epistemic level.
#
# WHY PER NODE: `mask0p25_intersection` is 25% of intersections dead and 75% healthy;
# globally the core (510.0) and FixedTime (507.0) are neck and neck, so the mean hides a
# disaster on a quarter of the network.
#
# THRESHOLD SWEEP (Step 8): four columns differing ONLY in the threshold. The headroom
# curve, "how much can be gained at which degree of blinding", is a result in itself, and
# it, not a chosen point, goes into chapter 4. The threshold for Step 9 is chosen by a RULE
# recorded here, before measurement: the largest threshold at which the loss under masks
# < 0.5 stays within noise. Otherwise it would be tuning on the set we later report on,
# the same thing avoided for tau and u_ref.
#
# `threshold: 1.00` is the most conservative variant (switch only when fully blinded): it
# still fires with `unit: intersection` and almost never under lane masks, so it separates
# the two regimes cleanly.
#
# EXPECTATIONS RECORDED BEFORE MEASUREMENT: `gate_share` decreases monotonically with the
# threshold; at 1.00 and lane masks ~0; on `clean` zero for every threshold (if not, it is a
# bug in the wrapper, not the threshold).
#
# SCOPE: JiNan, 3 seeds, four mask scenarios + `clean` (prepended automatically). The full
# plan on both networks only once the oracle shows there is something to win. `mask0p75` is
# here on purpose: the gap is largest there (917 vs 507), so if the oracle does not catch
# FixedTime EVEN THERE, the problem lies elsewhere than in the switching moment and we must stop.
#
# PASS CONDITION, recorded BEFORE measurement (two-sided!):
#   * `clean`      - gated ATT ~ core ATT (the gate has no right to fire),
#   * masks >= 0.5 - ATT close to FixedTime,
#   * `mask0p25`   - NOT WORSE than the core (there the core beats FixedTime: 426 vs 507).
# A false switch on clean costs 70% (296 vs 507), so the middle range is harder than the
# extremes and it will decide publishability.
#
# Diagnostics in the rows: `gate_share` and `gate_switches`, see `analysis/degradation.py`.
name: t2_gate
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}
  # `threshold` = the fraction of a node's INBOUND LANES in failure from which it hands
  # control to the rule (inclusive comparison). It enters the run fingerprint
  # (`MECHANISM_KEYS`), so every column is computed separately, and changing the threshold
  # invalidates the result instead of silently inheriting it.
  gatppo_gate_t0p25:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: oracle, threshold: 0.25}
  gatppo_gate_t0p50:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: oracle, threshold: 0.50}
  gatppo_gate_t0p75:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: oracle, threshold: 0.75}
  gatppo_gate_t1p00:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: oracle, threshold: 1.00}
  fixedtime: {}

scenarios:
  # `mask0p1` is the most sensitive probe for false switches: the core beats FixedTime
  # decisively there (354 vs 507), so every needless handover shows at once.
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.75}
