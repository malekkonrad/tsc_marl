# T2 dla BRAMKI FALLBACKU — wersja minimalna, z bramką-WYROCZNIĄ.
#
# Pytanie tego planu: ile da się ugrać przy IDEALNEJ detekcji. Wyrocznia czyta prawdę
# z warstwy awarii (`sensors.broken`), więc nie jest sterownikiem do wdrożenia — jest
# GÓRNYM OGRANICZENIEM dla bramek realnych (reguła z Kroku 8, UQ z Kroku 9). Jeśli tu
# nie ma zysku, żaden detektor go nie wyczaruje i nie ma po co go budować.
#
# DLACZEGO FIXEDTIME, a nie MaxPressure: pod ciężkimi maskami wszystko, co czyta
# detektory, jest gorsze od FixedTime (results/t2_nomech.md, JiNan mask0p5: rdzeń 743,
# Efficient-MP 648, Advanced-MP 750, FixedTime 507). Odporność bierze się tu z
# NIECZYTANIA zepsutych danych. MaxPressure zostaje dla poziomu epistemic.
#
# DLACZEGO PER WĘZEŁ: `mask0p25_intersection` to 25% skrzyżowań martwych i 75%
# zdrowych; globalnie rdzeń (510,0) i FixedTime (507,0) idą łeb w łeb, więc średnia
# ukrywa katastrofę na jednej czwartej sieci.
#
# SWEEP PROGU (Krok 8): cztery kolumny różniące się WYŁĄCZNIE progiem. Krzywa zapasu
# — „ile da się ugrać przy jakim stopniu oślepienia" — jest wynikiem sama w sobie i to
# ona, a nie wybrany punkt, idzie do rozdziału 4. Próg do Kroku 9 wybiera się REGUŁĄ
# zapisaną tutaj, przed pomiarem: największy próg, przy którym strata na maskach
# < 0,5 mieści się w szumie. Inaczej byłoby to strojenie na zbiorze, na którym
# potem raportujemy wynik — to samo, czego unikaliśmy przy τ i u_ref.
#
# `threshold: 1.00` to wariant maksymalnie zachowawczy (przełącz dopiero przy pełnym
# oślepieniu): przy `unit: intersection` nadal strzela, przy maskach pasowych prawie
# nigdy — czyli rozdziela te dwa reżimy czysto.
#
# OCZEKIWANIA ZAPISANE PRZED POMIAREM: `gate_share` maleje monotonicznie z progiem;
# przy 1,00 i maskach pasowych ≈ 0; na `clean` zero dla każdego progu (jeśli nie, to
# błąd powłoki, nie progu).
#
# ZAKRES: JiNan, 3 seedy, cztery scenariusze masek + `clean` (doklejany automatycznie).
# Pełny plan na obu sieciach dopiero wtedy, gdy wyrocznia pokaże, że jest o co grać.
# `mask0p75` jest tu celowo — tam przepaść jest największa (917 wobec 507), więc jeśli
# NAWET TAM wyrocznia nie dogoni FixedTime, problem leży gdzie indziej niż w momencie
# przełączenia i trzeba się zatrzymać.
#
# WARUNEK ZALICZENIA, zapisany PRZED pomiarem (dwustronny!):
#   * `clean`     — ATT bramkowanego ≈ ATT rdzenia (bramka nie ma prawa strzelić),
#   * maski ≥ 0,5 — ATT zbliżone do FixedTime,
#   * `mask0p25`  — NIE GORZEJ niż rdzeń (tam rdzeń bije FixedTime: 426 vs 507).
# Fałszywe przełączenie na czystym kosztuje 70% (296 vs 507), więc środkowy zakres
# jest trudniejszy niż skrajności i to on zdecyduje o publikowalności.
#
# Diagnostyka w wierszach: `gate_share` i `gate_switches` — patrz `analysis/degradation.py`.
name: t2_gate
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}
  # `threshold` = ułamek PASÓW WJAZDOWYCH węzła w awarii, od którego oddaje
  # sterowanie regule (porównanie nieostre). Wchodzi do odcisku biegu
  # (`MECHANISM_KEYS`), więc każda kolumna liczy się osobno, a zmiana progu
  # unieważnia wynik zamiast go po cichu odziedziczyć.
  gatppo_gate_t0p25:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: oracle, threshold: 0.25}
  gatppo_gate_t0p50:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: oracle, threshold: 0.50}
  gatppo_gate_t0p75:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: oracle, threshold: 0.75}
  gatppo_gate_t1p00:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: oracle, threshold: 1.00}
  fixedtime: {}

scenarios:
  # `mask0p1` to najczulsza sonda na fałszywe przełączenia: rdzeń bije tam FixedTime
  # zdecydowanie (354 vs 507), więc każde zbędne oddanie sterowania widać od razu.
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.75}
