# T2: training WITH UW-attention whose u comes from the freeze counter (`p1_uw_rule`).
#
# WHERE THIS PLAN COMES FROM. Everything we know about UW with the rule signal was measured on
# a FROZEN policy that got the modulation only at evaluation (`t2_uw_rule`). The only training
# with UW (`p1_uw` -> `t2_train_uw`) learned from the head on the TARGET side, i.e. from a
# signal ~random with respect to the broken source. So we do not know whether a policy that
# SEES a good signal in training learns to use it differently, in particular through the EDGE
# channel (protecting neighbours), which is worth ~0 on a frozen policy and makes UW redundant
# with the fallback gate (C5 in `kontrybucje.md`).
#
# ARMS AND PAIRS. Parents: `p1_fail` (failure training, no UW) and `p1_uw_rule` (the same
# failure mix, with UW from the rule). Every column has an EXPLICIT reference, and every pair
# differs in one thing:
#
#   column                   parent       mechanism at evaluation  vs                 question
#   gatppo                   t1 (clean)   -                        -                  T1 reference
#   gatppo_fail              p1_fail      -                        gatppo             DR (repeat of t2_train_uw)
#   gatppo_fail_uwinf        p1_fail      UW from the rule         gatppo_fail        UW added to the DR policy
#   gatppo_fail_uw_rule      p1_uw_rule   UW from the rule         gatppo_fail_uwinf  *1 WHAT TRAINING with the signal gives
#   gatppo_fail_gate         p1_fail      rule gate                gatppo_fail        the gate on the DR policy
#   gatppo_fail_uw_rule_gate p1_uw_rule   UW from the rule + gate  gatppo_fail_gate   *2 does trained-in UW add to the gate
#   fixedtime
#
# Pair *1 keeps the mechanism at evaluation fixed and changes only whether the policy learned
# with it: exactly "training vs bolting on". Pair *2 repeats the R4 decision of `t2_uw_rule`,
# but on a policy that could have learned the edge channel. Pairs with different parents are
# paired by (seed, draw) and the spread between trainings enters the difference; the report
# says so in the pair description (`shared_checkpoint`).
#
# Seeds 0-2 on both networks: that is what `p1_fail` has (JiNan and HangZhou, computed) and
# what `p1_uw_rule` is to have.
#
# HYPOTHESES RECORDED BEFORE MEASUREMENT:
#   T1 (clean, A3a): *1 without a significant difference on `clean`: the same failure mix,
#      and the rule is almost silent on clean (`uw_active` ~1%, `t2_uw_rule`).
#   T2 (*1, main): NO CONVICTION about the sign. For a gain: in training the policy sees
#      log rho hitting dead nodes and may learn to rely on neighbours more than when the
#      signal is bolted on. Against: `t2_train_uw` (head, target side) gave the sign AGAINST
#      under masks (+41 s at `mask0p5`), and DR alone already teaches the policy to ignore
#      zeros. A significant result means |t| >= 2.8 at `mask*_intersection` or `mask0p5` on
#      BOTH networks.
#   T3 (*2): ~0 at `mask*_intersection`, as on the frozen policy. A gain of the composition
#      would mean training opened the edge channel; then UW stops being redundant with the
#      gate and returns to the architecture as a LEARNED component.
#   T4 (drift): *1 ~0. The rule fires falsely under `drift` (precision 0 in `t2_uw_rule`), so
#      a policy trained with its signal may have learned to ignore the modulation more often
#      than it should; if so, it will show under masks, not under drift.
#   T0 (VALIDITY CONDITION, before anything else): `uw_active` on the clean test episodes at
#      the end of `p1_uw_rule` training <= 5% (suite header). The rule signal depends on the
#      policy: an untrained policy starves approaches and the rule fires on 87% of edges on
#      clean traffic. Without T0 a zero in *1/*2 is not a result.
#   Reading:
#   - T2 and T3 ~0 -> "training with the signal changes nothing": C5 unchanged, C6 gets the
#     statement that the second lever (DR) does not compose with UW. Closes the question of
#     section 3 of `faza3-po-t2.md` on a GOOD signal rather than a bad one.
#   - T2 gain, T3 ~0 -> training strengthens the loop channel; the redundancy with the gate stays.
#   - T3 gain -> training opens the edge channel. The strongest possible result for UW;
#     before writing it into the thesis REPEAT `t2_uw_channels` on the `p1_uw_rule` parent.
#
# REQUIRES: the computed `p1_uw_rule` suite (GPU machine, ~2.5 h) and `gate_ref__*.npz`.
name: t2_train_uw_rule
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}
  gatppo_fail:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_fail"
    baseline: gatppo
  gatppo_fail_uwinf:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_fail"
    uw: {tau: 0.25, side: source, u: rule}
    baseline: gatppo_fail
  gatppo_fail_uw_rule:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_uw_rule"
    # the mechanism MUST be on at evaluation: the policy learned with it
    uw: {tau: 0.25, side: source, u: rule}
    baseline: gatppo_fail_uwinf
  gatppo_fail_gate:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_fail"
    gate: {kind: rule, k_on: 3, k_off: 6}
    baseline: gatppo_fail
  gatppo_fail_uw_rule_gate:
    agent: gatppo
    seeds: [0, 1, 2]
    parent: "{agent}__{network}__s{seed}_y{yellow}__p1_uw_rule"
    gate: {kind: rule, k_on: 3, k_off: 6}
    uw: {tau: 0.25, side: source, u: rule}
    baseline: gatppo_fail_gate
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
