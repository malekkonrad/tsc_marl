# ACTION MASKING: a limit on service age. Phase 4, the first mechanism aimed at STARVATION
# rather than travel time.
#
# WHY. `results/t2_gate_thr.md` showed a number `att` cannot see: under masks the core
# leaves one phase without green for 2386-3160 s on JiNan and 2680-3060 s on HangZhou, i.e.
# MORE THAN 40 of the episode's 60 minutes. Degradation under detector failure is thus not
# only longer trips but ABANDONED DIRECTIONS (`faza3-po-t2.md` section 8.7). This plan
# measures a mechanism that limits this directly.
#
# MECHANISM. Per intersection: if a legal phase has waited >= `k_max` decisions, the policy's
# action is overridden with the oldest overdue phase. The mask READS NO SENSOR at all, it
# only counts its own actions, so it is robust to detector failure by construction. It meets
# the three profitability conditions of section 7.7 by definition: it is not an uncertainty
# estimator, it is cheap when wrong (one interval on an empty phase), and it is a DISCRETE
# restriction of the action set.
#
# WARNING: HOW TO READ IT, TWO METRIC TRAPS, both recorded BEFORE measurement:
#
#   1. Do NOT read `att` alone. The mask prevents rare bad events, it does not shorten
#      trips; on ATT I expect ZERO or a slight LOSS. A zero on ATT is not a failure of the
#      mechanism but a mismatch between metric and goal. I would make the same mistake
#      measuring UW-attention by a violation count.
#   2. Do NOT read `wait_max` alone. It is monotone in the override rate, so its optimum is
#      "always force" (k_max = 1), which is round-robin, i.e. a fixed cycle, and costs
#      ~150 s of ATT (measured on the gate, section 8.7). The tail metric by itself is a
#      DEGENERATE goal.
#
#   The right reading is the TRADE-OFF CURVE: `att` against `wait_max_demand`, point by point
#   over `k_max`. That is why the plan has four limits, not one: a single column would say
#   nothing not known in advance.
#
# HYPOTHESES RECORDED BEFORE MEASUREMENT:
#
#  H1 (guarantee). `wait_max` of a column with limit `k_max` does not exceed
#     (k_max + number_of_legal_phases - 1) x 15 s. This is NOT a hard k_max: with several
#     overdue phases at once only one can be served. If exceeded, the mechanism has a bug,
#     not a "weak result", and this is the only hypothesis of this plan that is a test of
#     CORRECTNESS rather than of the result.
#
#  H2 (price on clean). On `clean` the mask hardly fires, since the policy rotates phases
#     anyway: the core's `wait_max` on clean is 545 s (JiNan) ~ 36 decisions. At k_max=16 I
#     therefore expect overrides of a few percent and delta att within noise; at k_max=4 the
#     mask starts overriding on clean and ATT rises SIGNIFICANTLY.
#     The knee is the plan's question, not background.
#
#  H3 (gain under failure). The largest gain in `wait_max_demand` at `mask0p5` and
#     `mask0p5_intersection`, where the core starves longest (3160 s), and the mask does not
#     depend on sensors, so it works exactly as on clean. This is the only mechanism in the
#     thesis whose effectiveness does NOT degrade with failure.
#
#  H4 (vs the gate). The gate also lowers `wait_max`, but as a SIDE effect of handing control
#     to a fixed cycle, and only at nodes it judged blinded. The mask acts at ALL nodes and
#     without detection. I expect that under `gauss2` (where the gate does not fire ONCE,
#     section 8.3) the mask will be the only mechanism reducing starvation. That separates
#     the two mechanisms more cleanly than ATT.
#
# SCOPE: two networks, 3 seeds, a POST HOC arm (the mask on a finished policy).
# HangZhou added 2026-09-20 AFTER the JiNan result and AFTER `t2_gate_dr` showed that
# HangZhou can REVERSE conclusions (section 8.8: there DR alone beats the gate, on JiNan the
# opposite). The mask is the only mechanism of the thesis with a HARD GUARANTEE, so leaving
# it on one network would be the weakest point of the strongest claim.
#
# WHAT TO EXPECT, recorded before measurement: the guarantee (H1) is network-independent by
# CONSTRUCTION (the mask counts its own actions, not readings), so `wait_max` MUST stay within
# the bound on HangZhou too. If not, it is an implementation bug, not a result. The COST,
# however, is uncertain: HangZhou has 16 nodes with another phase distribution, and the core
# there has a clean `wait_max` of 1000 s against 545 s on JiNan (section 8.7), i.e. the
# policy rotates phases MORE SLOWLY. At the same `k_max` the mask will thus override MORE
# OFTEN on HangZhou, and the knee may fall at a larger `k_max` than 16. An arm trained WITH
# THE MASK needs a change in the training loop and is a separate item (GPU machine), and the
# result of [[bodagala-2026-ucatsc]] ("a mask bolted on post hoc removes violations but does
# not reproduce integrated behaviour") and section 1 of this thesis suggest that post hoc it
# will cut starvation and NOT improve travel. If so, that is a result, not a failure, and
# only the trained arm decides whether better was possible.
#
# k_max in DECISIONS (dt = 15 s): 4 = 1 min, 8 = 2 min, 16 = 4 min, 24 = 6 min.
# 16 is the practice reference point: the maximum red in urban guidelines tends to be
# 2-4 min; the value is NOT tuned to the result and must be described that way.
name: t2_mask
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}

  gatppo_mask_k24:
    agent: gatppo
    seeds: [0, 1, 2]
    mask: {k_max: 24}

  gatppo_mask_k16:
    agent: gatppo
    seeds: [0, 1, 2]
    mask: {k_max: 16}

  gatppo_mask_k8:
    agent: gatppo
    seeds: [0, 1, 2]
    mask: {k_max: 8}

  gatppo_mask_k4:
    agent: gatppo
    seeds: [0, 1, 2]
    mask: {k_max: 4}

  fixedtime: {}

scenarios:
  - {kind: gauss, level: 2.0}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
