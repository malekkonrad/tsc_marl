# Próg reguły w DÓŁ — domknięcie „Otwarte" z §2b notatki Fazy 3.
#
# PYTANIE. Przy `mask0p5` na JiNan reguła daje 525,7 s, czyli 3,7% NAD progiem FixedTime
# (507,0). Złożenie z treningiem na awariach schodzi do 481,1 s (`t2_gate_dr`), ale płaci
# +3,3 s na czystym. Jeśli SAMA reguła po rekalibracji zejdzie pod 507, narracja pracy się
# upraszcza radykalnie: jeden mechanizm, zero treningu, zero podatku na ruchu czystym.
# Ten plan sprawdza, czy tak jest.
#
# ⚠ ZIARNISTOŚĆ — NAJWAŻNIEJSZE OGRANICZENIE TEGO PLANU. Wynik reguły to UŁAMEK
# podejrzanych ruchów węzła, a ruchów jest 8 (`env.features.n_mov`), więc wynik należy do
# {0, 1/8, ..., 1} i porównanie jest `>=`. Kalibracja dała 0,25 = 2/8 na JiNan
# (`runs/heads/gate_ref__cityflow_jinan3x4_4ph.npz`), zatem NA TEJ SIECI ISTNIEJE
# DOKŁADNIE JEDEN niższy próg: 0,125 = 1/8. „Sweep w dół" jest tu pojedynczym punktem,
# nie krzywą — i jeśli 0,125 nie wystarczy, następnym pokrętłem NIE jest próg, tylko OKNO
# (12 kroków = 3 min) albo histereza (k_on = 3). Do zapisania w rozdziale 4 wprost, bo
# „obniżyliśmy próg" sugeruje continuum, którego nie ma.
#
# HangZhou jest tu z innego powodu: tam kalibracja dała 0,875 = 7/8 (na czystym oknie tej
# sieci wiele ruchów legalnie stoi), czułość 0,08–0,23, więc bramka strzela rzadko i pewnie.
# Sześć stopni w dół to realna przestrzeń i to jest DOSŁOWNIE otwarte pytanie z §2b
# („większy budżet fałszywych alarmów na sieciach rzadkich"). Stąd 0,25 i 0,5 jako punkty
# pośrednie — bez nich skok 0,875 → 0,125 nie dałby się zinterpretować.
#
# KOLUMNY liczą się z TEGO SAMEGO checkpointu (bramka jest bezparametrowa wobec wag), więc
# różnice są parowane. `threshold` wchodzi do odcisku biegu (`MECHANISM_KEYS`) — bez tego
# cztery kolumny miałyby ten sam odcisk i trzy zostałyby pominięte jako „jest wynik".
# Kolumna `gatppo_gate_auto` liczy próg z artefaktu i jest KONTROLĄ: na JiNan musi wyjść
# identycznie jak 0,250, na HangZhou identycznie jak żaden z jawnych progów (0,875).
#
# HIPOTEZY ZAPISANE PRZED POMIAREM
#
#  H1 (główna, JiNan). Próg 0,125 zejdzie przy `mask0p5` poniżej 507,0 s. Podstawa: przy
#     0,25 czułość reguły to 0,70 przy udziale 57,4%, więc jest jeszcze co wykrywać.
#     WARUNEK ZALICZENIA JEST TRÓJSTRONNY i zapisany teraz, żeby nie dobierać go po
#     zobaczeniu tabeli: (a) `mask0p5` < 507,0; (b) `clean` — Δ wobec rdzenia NIEISTOTNE;
#     (c) `mask0p25` i `mask0p25_hold_t60` NIE GORSZE niż przy progu 0,250. Spełnione (a)
#     bez (b) i (c) nie jest sukcesem — to przesunięcie kosztu, nie jego usunięcie.
#
#  H2 (gdzie jest wąskie gardło). Wiążącym ograniczeniem będzie `clean` i rodzina
#     `mask0p25`, bo tam polityka bije FixedTime (296 vs 507, czyli 211 s zapasu do
#     stracenia) — a nie `mask0p5`. Przewidywany tryb porażki H1: `mask0p5` owszem zejdzie,
#     ale `clean` urośnie istotnie, bo `gate_share` na czystym przy 1/8 przebije budżet
#     0,5% wyzwoleń. Diagnostyka rozstrzygająca: `gate_share__clean` — przy 0,25 wynosi
#     1,6%, przy histerezie 3/6 odpowiada to ~0,3% wyzwoleń.
#
#  H3 (test szczelności analizy z §7.1). Przy 0,125 `gauss2` NADAL nie strzeli ani razu.
#     Uzasadnienie mechanistyczne: kryterium podejrzenia to `max − min < 1e−6` w oknie 12,
#     a próg decyduje tylko o TYM, ILU ruchów to dotyczy — nie o tym, JAK mocno. Szum łamie
#     kryterium przy każdym progu. GDYBY `gauss2` strzeliło, znaczyłoby to, że coś innego
#     niż awaria zamraża odczyt, i cała tabela 7.1 („reguła strzela tam, gdzie się opłaca")
#     wymaga rewizji. To jest najtańszy test tej tezy, jaki istnieje.
#
#  H4 (HangZhou). Zysk z obniżenia będzie tam WIĘKSZY niż na JiNan, bo 0,875 jest skrajnie
#     zachowawcze. Ryzyko przeciwne i dlatego progi pośrednie: na czystym oknie HangZhou
#     wiele ruchów legalnie stoi, więc 0,125 może strzelać niemal stale i zniszczyć wynik
#     czysty. Przewidywany punkt pracy: 0,25 albo 0,5, nie 0,125.
#
# ZAKRES: dwie sieci, 3 seedy. Wagi rdzenia dla obu sieci są lokalnie, bramka nie dotyka
# wag — plan jest ewaluacją na CPU, bez GPU i bez treningu.
#
# WYMAGA: runs/heads/gate_ref__{sieć}.npz (są dla obu sieci).
name: t2_gate_thr
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}

  # 1/8 ruchów — JEDYNY próg niższy od kalibracji JiNan. To jest pytanie planu.
  gatppo_gate_t0p125:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, threshold: 0.125, k_on: 3, k_off: 6}

  # 2/8 — kalibracja JiNan; na HangZhou pierwszy punkt pośredni
  gatppo_gate_t0p250:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, threshold: 0.250, k_on: 3, k_off: 6}

  # 4/8 — drugi punkt pośredni dla HangZhou, kontrola kierunku dla JiNan
  gatppo_gate_t0p500:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, threshold: 0.500, k_on: 3, k_off: 6}

  # próg Z ARTEFAKTU (0,25 JiNan / 0,875 HangZhou) — kontrola kalibracji:
  # na JiNan MUSI wyjść identycznie jak kolumna 0,250, inaczej coś jest nie tak
  # ze ścieżką `build_gate`.
  gatppo_gate_auto:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, k_on: 3, k_off: 6}

  fixedtime: {}

scenarios:
  - {kind: gauss, level: 2.0}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
