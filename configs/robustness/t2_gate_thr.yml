# The rule threshold DOWNWARDS: closing the "Open" item of section 2b of the Phase 3 note.
#
# QUESTION. At `mask0p5` on JiNan the rule gives 525.7 s, 3.7% ABOVE the FixedTime threshold
# (507.0). Composed with failure training it goes down to 481.1 s (`t2_gate_dr`), but pays
# +3.3 s on clean. If the rule ALONE, recalibrated, goes below 507, the thesis narrative
# simplifies radically: one mechanism, no training, no tax on clean traffic.
# This plan checks whether that is so.
#
# WARNING: GRANULARITY, THE MOST IMPORTANT LIMITATION OF THIS PLAN. The rule score is the
# FRACTION of a node's suspicious movements, and there are 8 movements (`env.features.n_mov`),
# so the score lies in {0, 1/8, ..., 1} and the comparison is `>=`. Calibration gave
# 0.25 = 2/8 on JiNan (`runs/heads/gate_ref__cityflow_jinan3x4_4ph.npz`), so ON THIS NETWORK
# THERE IS EXACTLY ONE lower threshold: 0.125 = 1/8. The "sweep downwards" is a single point
# here, not a curve, and if 0.125 is not enough, the next knob is NOT the threshold but the
# WINDOW (12 steps = 3 min) or the hysteresis (k_on = 3). To be stated plainly in chapter 4,
# since "we lowered the threshold" suggests a continuum that does not exist.
#
# HangZhou is here for another reason: there calibration gave 0.875 = 7/8 (on this network's
# clean window many movements legitimately stand still), recall 0.08-0.23, so the gate fires
# rarely and confidently. Six steps down is real room, and that is LITERALLY the open
# question of section 2b ("a larger false-alarm budget on sparse networks"). Hence 0.25 and
# 0.5 as intermediate points; without them the jump 0.875 -> 0.125 could not be interpreted.
#
# The COLUMNS are computed from THE SAME checkpoint (the gate has no parameters with respect
# to the weights), so differences are paired. `threshold` enters the run fingerprint
# (`MECHANISM_KEYS`); without it four columns would share a fingerprint and three would be
# skipped as "has a result". The `gatppo_gate_auto` column takes the threshold from the
# artefact and is a CONTROL: on JiNan it must come out identical to 0.250, on HangZhou
# identical to none of the explicit thresholds (0.875).
#
# HYPOTHESES RECORDED BEFORE MEASUREMENT
#
#  H1 (main, JiNan). Threshold 0.125 goes below 507.0 s at `mask0p5`. Basis: at 0.25 the
#     rule's recall is 0.70 at a 57.4% share, so there is still something to detect.
#     THE PASS CONDITION IS THREEFOLD and recorded now so it is not chosen after seeing the
#     table: (a) `mask0p5` < 507.0; (b) `clean`: delta vs the core NOT SIGNIFICANT;
#     (c) `mask0p25` and `mask0p25_hold_t60` NOT WORSE than at threshold 0.250. Meeting (a)
#     without (b) and (c) is not a success: it moves the cost rather than removing it.
#
#  H2 (where the bottleneck is). The binding constraint will be `clean` and the `mask0p25`
#     family, since there the policy beats FixedTime (296 vs 507, 211 s of headroom to
#     lose), not `mask0p5`. Predicted failure mode of H1: `mask0p5` does go down, but `clean`
#     grows significantly, since `gate_share` on clean at 1/8 breaks the 0.5% trigger
#     budget. Decisive diagnostic: `gate_share__clean`; at 0.25 it is 1.6%, which with 3/6
#     hysteresis corresponds to ~0.3% of triggers.
#
#  H3 (a tightness test of the section 7.1 analysis). At 0.125 `gauss2` STILL does not fire
#     once. Mechanistic justification: the suspicion criterion is `max - min < 1e-6` over a
#     window of 12, and the threshold only decides HOW MANY movements it concerns, not HOW
#     STRONGLY. Noise breaks the criterion at any threshold. IF `gauss2` fired, it would mean
#     something other than a failure freezes the reading, and the whole table 7.1 ("the rule
#     fires where it pays off") would need revision. This is the cheapest test of that claim
#     there is.
#
#  H4 (HangZhou). The gain from lowering will be LARGER there than on JiNan, since 0.875 is
#     extremely conservative. The opposite risk, hence the intermediate thresholds: on
#     HangZhou's clean window many movements legitimately stand still, so 0.125 may fire
#     almost constantly and destroy the clean result. Predicted operating point: 0.25 or
#     0.5, not 0.125.
#
# SCOPE: two networks, 3 seeds. The core weights for both networks are local, the gate does
# not touch weights; the plan is a CPU evaluation, without a GPU or training.
#
# REQUIRES: runs/heads/gate_ref__{network}.npz (present for both networks).
name: t2_gate_thr
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2]}

  # 1/8 of movements, the ONLY threshold below the JiNan calibration. The plan's question.
  gatppo_gate_t0p125:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, threshold: 0.125, k_on: 3, k_off: 6}

  # 2/8, the JiNan calibration; on HangZhou the first intermediate point
  gatppo_gate_t0p250:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, threshold: 0.250, k_on: 3, k_off: 6}

  # 4/8, the second intermediate point for HangZhou, a direction check for JiNan
  gatppo_gate_t0p500:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, threshold: 0.500, k_on: 3, k_off: 6}

  # threshold FROM THE ARTEFACT (0.25 JiNan / 0.875 HangZhou), a calibration control:
  # on JiNan it MUST come out identical to the 0.250 column, otherwise something is
  # wrong with the `build_gate` path.
  gatppo_gate_auto:
    agent: gatppo
    seeds: [0, 1, 2]
    gate: {kind: rule, k_on: 3, k_off: 6}

  fixedtime: {}

scenarios:
  - {kind: gauss, level: 2.0}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
