# T2 dla UW-attention po stronie ŹRÓDŁA krawędzi — korekta mapowania z `t2_uw`.
#
# CO POPRAWIAMY. `t2_uw` liczył u krawędzi j→i z ruchów CELU i, których droga
# wjazdowa zaczyna się w j (`obs_head.edge_uncertainty`, side="target"). Attention na
# tej krawędzi waży jednak `hidden_embedding(x_j)` — reprezentację z odczytów ŹRÓDŁA j.
# Wiarygodność wiadomości zależy więc od czujników j, a nie od pasów drogi j→i.
# Najostrzej widać to przy martwym skrzyżowaniu j (`unit: intersection`, właściciel
# pasa = skrzyżowanie, do którego pas dojeżdża): droga j→i należy do zdrowego i, więc
# sąsiedzi nadal w pełni ufają śmieciom z j, a w samym j cała grupa softmaxu dostaje
# równą karę i modulacja jest tożsamościowa. Hipoteza A3b z `t2_uw.yml` („intersection
# ma wyjść na zero") była skutkiem tego mapowania, a nie własnością zadania.
#
# Kolumny: rdzeń · UW po stronie celu (powtórka `t2_uw` W TYM SAMYM zestawie losowań) ·
# UW po stronie źródła · wyrocznia modulacji (niżej) · FixedTime. Wszystkie cztery
# uczone kolumny liczą się z TEGO SAMEGO checkpointu i tym samym τ; `gatppo_uw` i
# `gatppo_uw_src` mają też tę samą głowę (odcisk bez zmian) — różni je wyłącznie
# strona krawędzi, więc porównanie jest parowane.
#
# τ = 0,25 ZOSTAJE świadomie, choć dobrano je regułą „rozstęp przy gauss2 = ln 10"
# na stronie celu. Przeliczone na zrzucie BC (ogon, JiNan) po stronie źródła daje przy
# gauss2 rozstęp 2,43 wobec 2,30 — ta sama skala, więc reguła nie wymaga innego τ,
# a jedna liczba mniej to jedno źródło różnicy mniej.
#
# SPRAWDZENIE PRZED POMIAREM (zrzut BC z Advanced-MP, ogon epizodu, τ = 0,25):
#
#   sieć      scenariusz              rozstęp tgt  rozstęp src  trafienie tgt  trafienie src
#   JiNan     clean                      0,38         0,15           —              —
#   JiNan     mask0p25                   0,69         0,47         0,505          0,529
#   JiNan     mask0p25_intersection      0,49         0,27         0,496          0,539
#   HangZhou  mask0p25                   0,30         0,05           —              —
#   HangZhou  mask0p25_intersection      0,22         0,03         0,496          0,499
#
#   „trafienie" = AUROC kary krawędzi (−log ρ) względem tego, czy ŹRÓDŁO krawędzi ma
#   > 25% zepsutych ruchów. 0,5 = kara nie ma związku z tym, czyja wiadomość jest zła.
#   (skrypt jednorazowy, nie w repo; do powtórzenia na `EDGE_SIDES` i `group_spread`)
#
# HIPOTEZY ZAPISANE PRZED POMIAREM:
#   H1 (no-op na czystym, A3a): `clean` bez istotnej różnicy vs rdzeń — po stronie
#      źródła modulacja jest na czystym jeszcze cichsza (0,15 vs 0,38).
#   H2 (główna, raczej NEGATYWNA): strona źródła poprawia TRAFIENIE, ale tylko
#      nieznacznie (0,54 vs 0,50), bo wąskim gardłem jest sama głowa — u ruchu słabo
#      śledzi martwe detektory (AUROC 0,651 na niewidzianych maskach, `gate_2_2.md`).
#      Przewidywanie: JiNan `mask*_intersection` co najwyżej mały zysk wobec
#      `gatppo_uw`, bez przekroczenia |t| ≥ 2,8; lane-maski i gauss — zero.
#   H3 (HangZhou): zero we wszystkich scenariuszach maskowych, bo po stronie źródła
#      głowa jest tam przy maskach niema (rozstęp 0,03–0,05, poniżej czystego).
#      To rozdziela dwie przyczyny zera z `faza3-po-t2.md` §1: jeśli HangZhou zostaje
#      na zerze, a JiNan się rusza, zawiodło mapowanie; jeśli obie na zerze — głowa.
#   Wynik zgodny z H2+H3 zamyka C5 przy POPRAWNEJ semantyce krawędzi i przenosi
#   ciężar wyjaśnienia na jakość sygnału. Wynik sprzeczny (istotny zysk przy
#   intersection) = C5 do przepisania: mechanizm działał, tylko na złej krawędzi.
#
# WYROCZNIA MODULACJI (`gatppo_uw_oracle`, dopisana 2026-09-23, też przed pomiarem).
# Ta sama modulacja po stronie źródła, ale u = ułamek MARTWYCH pasów wjazdowych
# węzła wprost z warstwy awarii (`controllers.OracleUncertainty`, definicja jak
# `OracleGate`), log ρ = −u/τ bez `u_ref` (na czystym u ≡ 0). Rola jak wyroczni
# bramki w `t2_gate`: SUFIT mechanizmu, nie sterownik do wdrożenia. τ = 0,25 →
# całkowicie martwy węzeł −4 naty (~55× mniejsza waga).
#   H4 (rozstrzygająca): wyrocznia daje istotny zysk (|t| ≥ 2,8) przy
#      `mask*_intersection` na obu sieciach — tam wiadomość martwego węzła jest
#      w całości śmieciem, a zdrowi sąsiedzi są pod ręką (C3: GNN wart tam do 355 s).
#      Przy gauss i drift wyrocznia jest z definicji NIEMA (brak martwych pasów) —
#      to nie jest wynik, tylko granica tej wyroczni; nie czytać tych wierszy.
#   Odczyt: H4 obalona → ważenie sąsiadów niepewnością nie pomaga nawet przy
#   idealnym sygnale, C5 zamknięte bez zastrzeżeń. H4 potwierdzona, a
#   `gatppo_uw_src` na zerze → wąskim gardłem jest głowa, mechanizm żyje
#   (future work: głowa uczona na etykiecie „martwy" na przebiegach polityki).
#
# Diagnostyka w wierszach jak w `t2_uw`: `uw_spread`, `uw_active`.
#
# WYMAGA (oprócz głowy i `u_ref` po stronie celu, jak `t2_uw`):
#   runs/heads/u_ref__<sieć>__source.npz — dla ISTNIEJĄCEJ głowy, bez przeuczania:
#     tsc obshead -n <sieć> --reference source
#   Policzone na laptopie 2026-09-23; głowy na laptopie i gliderze mają ten sam odcisk
#   (82cbe169… JiNan, e562946a… HangZhou), więc wystarczy rsync samych plików `__source`.
name: t2_uw_src
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2, 3, 4]}
  gatppo_uw:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25}
  gatppo_uw_src:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source}
  gatppo_uw_oracle:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source, u: oracle}
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
