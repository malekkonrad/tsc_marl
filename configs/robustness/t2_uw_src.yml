# T2 for UW-attention on the edge SOURCE side: a correction of the mapping in `t2_uw`.
#
# WHAT WE FIX. `t2_uw` computed u of edge j->i from the movements of the TARGET i whose
# approach road starts at j (`obs_head.edge_uncertainty`, side="target"). Attention on that
# edge, however, weighs `hidden_embedding(x_j)`, a representation of the SOURCE j's readings.
# The reliability of the message therefore depends on j's sensors, not on the lanes of road
# j->i. It shows most sharply for a dead intersection j (`unit: intersection`, lane owner =
# the intersection the lane leads to): road j->i belongs to the healthy i, so the neighbours
# still fully trust j's garbage, while in j itself the whole softmax group gets an equal
# penalty and the modulation is the identity. Hypothesis A3b of `t2_uw.yml` ("intersection
# should come out zero") was a consequence of this mapping, not a property of the task.
#
# Columns: core, UW on the target side (a repeat of `t2_uw` ON THE SAME set of draws),
# UW on the source side, the modulation oracle (below), FixedTime. All four learned columns
# are computed from THE SAME checkpoint with the same tau; `gatppo_uw` and `gatppo_uw_src`
# also share the head (fingerprint unchanged), so only the edge side separates them and
# the comparison is paired.
#
# tau = 0.25 STAYS deliberately, although it was chosen by the rule "spread at gauss2 =
# ln 10" on the target side. Recomputed on the BC dataset (tail, JiNan) on the source side
# it gives a gauss2 spread of 2.43 against 2.30, the same scale, so the rule needs no other
# tau, and one number fewer is one source of difference fewer.
#
# CHECK BEFORE MEASUREMENT (BC dataset from Advanced-MP, episode tail, tau = 0.25):
#
#   network   scenario                spread tgt   spread src   hit tgt   hit src
#   JiNan     clean                      0.38         0.15          -         -
#   JiNan     mask0p25                   0.69         0.47        0.505     0.529
#   JiNan     mask0p25_intersection      0.49         0.27        0.496     0.539
#   HangZhou  mask0p25                   0.30         0.05          -         -
#   HangZhou  mask0p25_intersection      0.22         0.03        0.496     0.499
#
#   "hit" = AUROC of the edge penalty (-log rho) against whether the edge SOURCE has
#   > 25% broken movements. 0.5 = the penalty is unrelated to whose message is bad.
#   (a one-off script, not in the repo; to repeat with `EDGE_SIDES` and `group_spread`)
#
# HYPOTHESES RECORDED BEFORE MEASUREMENT:
#   H1 (no-op on clean, A3a): `clean` without a significant difference vs the core; on the
#      source side the modulation is even quieter on clean (0.15 vs 0.38).
#   H2 (main, rather NEGATIVE): the source side improves the HIT, but only slightly
#      (0.54 vs 0.50), because the bottleneck is the head itself: a movement's u tracks dead
#      detectors poorly (AUROC 0.651 on unseen masks, `gate_2_2.md`).
#      Prediction: JiNan `mask*_intersection` at most a small gain over `gatppo_uw`, without
#      crossing |t| >= 2.8; lane masks and gauss zero.
#   H3 (HangZhou): zero in all mask scenarios, since on the source side the head is mute
#      there under masks (spread 0.03-0.05, below clean).
#      This separates the two causes of the zero in `faza3-po-t2.md` section 1: if HangZhou
#      stays at zero while JiNan moves, the mapping failed; if both stay at zero, the head.
#   A result consistent with H2+H3 closes C5 under the CORRECT edge semantics and shifts the
#   weight of the explanation onto signal quality. A contradicting result (a significant
#   gain at intersection) = C5 to rewrite: the mechanism worked, only on the wrong edge.
#
# MODULATION ORACLE (`gatppo_uw_oracle`, added 2026-09-23, also before measurement).
# The same source-side modulation, but u = the fraction of the node's DEAD inbound lanes
# taken directly from the failure layer (`controllers.OracleUncertainty`, defined like
# `OracleGate`), log rho = -u/tau without `u_ref` (u = 0 on clean). Its role is that of the
# gate oracle in `t2_gate`: the mechanism's CEILING, not a deployable controller.
# tau = 0.25 -> a completely dead node -4 nats (~55x less weight).
#   H4 (decisive): the oracle gives a significant gain (|t| >= 2.8) at
#      `mask*_intersection` on both networks: there the dead node's message is entirely
#      garbage and healthy neighbours are at hand (C3: the GNN is worth up to 355 s there).
#      Under gauss and drift the oracle is MUTE by definition (no dead lanes); that is not a
#      result but the limit of this oracle; do not read those rows.
#   Reading: H4 rejected -> weighting neighbours by uncertainty does not help even with a
#   perfect signal, C5 closed without reservations. H4 confirmed while `gatppo_uw_src` is at
#   zero -> the head is the bottleneck, the mechanism lives (future work: a head trained on
#   a "dead" label on policy rollouts).
#
# Diagnostics in the rows as in `t2_uw`: `uw_spread`, `uw_active`.
#
# REQUIRES (besides the head and the target-side `u_ref`, as `t2_uw`):
#   runs/heads/u_ref__<network>__source.npz, for an EXISTING head, without retraining:
#     tsc obshead -n <network> --reference source
#   Computed on the laptop on 2026-09-23; the heads on the laptop and the GPU machine share
#   the fingerprint (82cbe169... JiNan, e562946a... HangZhou), so rsync of the `__source`
#   files alone is enough.
name: t2_uw_src
mode: realistic
draws: 5
timeout: 7200

networks: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]

controllers:
  gatppo: {seeds: [0, 1, 2, 3, 4]}
  gatppo_uw:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25}
  gatppo_uw_src:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source}
  gatppo_uw_oracle:
    agent: gatppo
    seeds: [0, 1, 2, 3, 4]
    uw: {tau: 0.25, side: source, u: oracle}
  fixedtime: {}

scenarios:
  - {kind: gauss, level: 1.0}
  - {kind: gauss, level: 2.0}
  - {kind: gauss, level: 4.0}
  - {kind: mask, level: 0.1}
  - {kind: mask, level: 0.25}
  - {kind: mask, level: 0.5}
  - {kind: mask, level: 0.25, unit: intersection}
  - {kind: mask, level: 0.5, unit: intersection}
  - {kind: mask, level: 0.25, substitution: hold, onset: 60}
  - {kind: mask, level: 0.5, substitution: hold, onset: 60}
  - {kind: drift, level: 0.3}
  - {kind: drift, level: 0.5}
