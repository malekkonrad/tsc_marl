# Ablacja 1.6 — po co GNN: actor bez sąsiadów (MLP tej samej głębokości,
# parameter sharing jak w MPLight). Krytyk zostaje GAT — pytamy o DECYZJĘ.
#
# GPU (entry: core) — do liczenia na gliderze. Sufiks run_id = nazwa pliku.
entry: core
mode: realistic
timeout: 86400
ngpu: "0"

grid:
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2, 3, 4]   # 3–4 dograne pod Fazę 3 (protokół: 5 seedów w robustness)

overrides:
  model: {encoder: none}
