# Ablation 1.6: why a GNN: an actor without neighbours (an MLP of the same depth,
# parameter sharing as in MPLight). The critic stays GAT: the question is about the DECISION.
#
# GPU (entry: core), to be computed on the GPU machine. run_id suffix = file name.
entry: core
mode: realistic
timeout: 86400
ngpu: "0"

grid:
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2, 3, 4]   # 3-4 added for Phase 3 (protocol: 5 seeds in robustness)

overrides:
  model: {encoder: none}
