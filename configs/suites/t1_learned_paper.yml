# T1: learned methods in BENCHMARK MODE (yellow=0), the way the papers compute them.
#
# Closes the last open statement of the Phase 0 gate: does the pipeline reproduce
# the literature for LEARNED methods too. The only Advanced-CoLight run in this
# mode so far is `sanity60` (60 episodes, 8 phases), too little to stand next to
# 245.73 (JiNan-1) and 270.45 (HangZhou-1) from the paper. CoLight alongside,
# since the literature reports 272.06 for it.
#
# CPU for the same reason as t1_learned.yml.
entry: tsc
mode: benchmark
timeout: 86400
ngpu: "-1"

grid:
  agent: [advancedcolight, colight]
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2]
