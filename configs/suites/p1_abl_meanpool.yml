# Ablacja 1.6 — GAT vs mean-pool (GraphSAGE): czy UCZONE ważenie sąsiadów coś daje.
# Actor: SAGEConv(mean) zamiast MultiHeadAttModel, reszta bez zmian (krytyk zostaje GAT).
#
# GPU (entry: core) — do liczenia na gliderze. Sufiks run_id = nazwa pliku.
entry: core
mode: realistic
timeout: 86400
ngpu: "0"

grid:
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2]

overrides:
  model: {encoder: mean}
