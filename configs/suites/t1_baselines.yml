# T1: the thesis reference point, methods without learning or training.
# No `overrides`, so it hits the same run_ids as manual runs and sees results
# computed earlier as done (it does not recompute them).
entry: tsc
mode: realistic          # yellow_length 5, the thesis protocol
timeout: 3600

grid:
  agent: [fixedtime, maxpressure, sotl, efficientmp, advancedmp]
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0]
