# Phase 1 GATE: the core (GAT + PPO + CTDE) must reach the ATT of Advanced-CoLight
# within a few percent. 2 networks x 3 seeds = 6 runs of a few hours each.
#
# `entry: core` selects `tsc_marl.runner.train_core` (our own PPO loop) instead of
# LibSignal's task path; the default agent is then `gatppo`.
entry: core
mode: realistic
timeout: 86400           # training, not a baseline

# The card each point runs on. "-1" = CPU. On a machine without CUDA it falls back
# to the CPU with a warning in the run log instead of breaking the grid. `ngpu`
# describes the MACHINE, not the experiment: it lands in the `command` section,
# which `build_params` leaves out of the fingerprint, so moving the grid to a GPU
# does not invalidate CPU results.
ngpu: "0"

grid:
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2, 3, 4]   # 3-4 added for Phase 3 (protocol: 5 seeds in robustness)
