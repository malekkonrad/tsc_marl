# Krakow (SUMO, `cracow-case-study`): the GAT+PPO+CTDE core trained on CLEAN traffic,
# the counterpart of `p1_gate` (JiNan/HangZhou). Parent of the `gatppo` column in `t2_krakow`.
#
# Trained ONLY on `mid` (4500 veh/h, just before the saturation knee; calibration in
# `data/raw_data/krakow_3w/README.md`); `low` and `high` are traffic OUTSIDE training
# in `t2_krakow`, like the demand variants `_d0p25` / `_r2000` on JiNan in `t2_ood`. The
# same network, so the same observation size and graph: the checkpoint transfers directly.
#
# Training on CPU (`ngpu: -1`): a GPU speeds nothing up here (SUMO is the bottleneck),
# and on 2026-10-09 the GPU machine's card was taken by another user (15.6 of 16 GB). In parallel:
#     tsc suite run k1_core -j 3
# run_id WITHOUT a suffix: `gatppo__sumo_krakow3w_mid__s<seed>_y5`; a suite without config
# overrides computes the reference run and gets no suffix (`runner/suite.Suite.suffix`).
entry: core
mode: realistic
timeout: 86400
ngpu: "-1"           # CPU: SUMO is the bottleneck, and the GPU machine's card is often taken

defaults:
  world: sumo

grid:
  network: [sumo_krakow3w_mid]
  seed: [0, 1, 2]
