# Krakow: the core on clean traffic, a REPEAT of `k1_core` that saves the BEST checkpoint (`model.save_best`).
#
# Why: in `t2_krakow` the policy lost to Webster already on clean `mid`, but its test
# episodes late in training jumped within ~340-430 s, and `att_best` (320-338 s) lay
# BELOW Webster (347.6). Question: is the loss due to the choice of the final checkpoint
# or to the policy's capability. `t2_krakow_best` answers on HELD-OUT traffic
# (`sumo_krakow3w_mid_s1`); on `mid` the clean result of the best checkpoint is by
# definition `att_best`, since a training test episode = clean `mid` in `tsc degrade`.
#
# Configuration identical to `k1_core` except `save_best` (tested in `test_training.py`); the
# key sits in `model`, so it changes `config_hash` and gives a suffix; the `k1_core` runs stay.
# run_id suffix: `gatppo__sumo_krakow3w_mid__s<seed>_y5__k2_core`.
#
entry: core
mode: realistic
timeout: 86400
ngpu: "-1"           # CPU: SUMO is the bottleneck, and the GPU machine's card is often taken

defaults:
  world: sumo

grid:
  network: [sumo_krakow3w_mid]
  seed: [0, 1, 2]

overrides:
  model:
    save_best: true
