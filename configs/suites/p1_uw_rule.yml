# Arm 3b (Phase 3, after `t2_uw_rule`): the core trained WITH FAILURES and WITH
# UW-attention whose u comes from the FROZEN DETECTOR COUNTER, on the edge SOURCE side.
#
# Why it is needed when `p1_uw` already exists. `p1_uw` learned from the observation
# head on the TARGET side, with a signal now known to have penalised largely the wrong
# edges (`results/t2_uw_src.md`) and to hit the broken source with AUROC ~0.5. That
# arm's zero (`t2_train_uw`) therefore says nothing about whether the policy WOULD
# LEARN to use the modulation if the signal were good. The rule signal is good: bolted
# onto a finished policy it collects 45-73% of the oracle ceiling (`t2_uw_rule`).
#
# Question: does a policy trained WITH this signal get more out of it than a policy
# that only gets it at evaluation; in particular, does it learn the EDGE channel
# (protecting neighbours from a dead node's message), which is worth ~0 on a frozen
# policy and makes UW redundant with the gate. Answered by plan
# `configs/robustness/t2_train_uw_rule.yml`.
#
# WARNING: the `failure_mix` BLOCK MUST BE IDENTICAL TO `p1_fail.yml` (the control,
# arm 2), copied character for character. The only difference between these suites is
# the `uw` key. Guarded by `tests/robustness/test_training.py`.
#
# The signal is built by `robustness.training.uw_signal`, the same function `tsc
# degrade` uses at evaluation, with the same window and threshold as the rule gate
# (`runs/heads/gate_ref__<network>.npz`), so the policy learns on EXACTLY the signal it
# is later measured with. The window warm-up (12 decisions without modulation at
# episode start) is part of the signal in training too.
#
# WARNING: THE SIGNAL DEPENDS ON THE POLICY (measured 2026-10-08 before the run, JiNan,
# clean traffic, one episode): FixedTime -> `uw_active` 5.5%; an untrained policy
# (argmax of random weights, not a single phase change) -> 87.2%. A policy that starves
# approaches fills them to capacity, readings STAND STILL, and the rule cannot tell a
# jam from a dead detector (`obs_head.suspicious_movements`). In the first training
# episodes the modulation will thus be largely false and should fall as the policy learns.
# VALIDITY CONDITION, checked BEFORE reading `t2_train_uw_rule`: `uw_active` of the
# (clean) test episodes in `runs/t1/gatppo__*__p1_uw_rule/metrics.csv`, `split=test`,
# over the last 10 episodes <= 5% (the FixedTime level; the trained core in `t2_uw_rule`:
# 1.2%). If it stays higher, the policy saw noise during training, not failures, and
# the arm's result is INVALID, not zero (the same trap as in `p1_uw`).
#
# REQUIRES: runs/heads/gate_ref__<network>.npz and obs_head__<network>.pt (threshold
# fingerprint) for both networks; they are on the GPU machine.
#
# GPU (entry: core), ~25 min per run on the GPU machine. run_id suffix = file name:
# `gatppo__<network>__s<seed>_y5__p1_uw_rule`.
entry: core
mode: realistic
timeout: 86400
ngpu: "0"

grid:
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2]

overrides:
  model:
    # tau, side and source as in the `gatppo_uw_rule` column of plan `t2_uw_rule`.
    uw: {tau: 0.25, side: source, u: rule}
    # The scenario is drawn PER EPISODE from a stream (mix seed, episode number)
    # independent of the policy's `--seed`, so both arms see the same failure
    # schedule (see `robustness/training.py`). WHICH detectors fail is then chosen
    # by `SensorModel` from (spec.seed, episode), so two episodes with the same
    # scenario break different lanes.
    failure_mix:
      seed: 0
      scenarios:
        # 1/3 of episodes clean. Not caution but condition A3a: the policy must stay
        # comparable with the core on clean traffic, and the `clean` column in T2
        # is the reference for every degradation.
        - {weight: 4, kind: none}
        # measurement noise, the OBSERVABLE level; `uw_spread` in T2: 0.74 / 2.21
        - {weight: 1, kind: gauss, level: 1.0}
        - {weight: 1, kind: gauss, level: 2.0}
        # dead detectors with a trace (`zero`), the INFERABLE level; most of the
        # fallback gain lies here, and the mechanism has its best chance here
        - {weight: 2, kind: mask, level: 0.25}
        - {weight: 1, kind: mask, level: 0.5}
        # a whole intersection without sensors: all inbound edges equally uncertain,
        # softmax is invariant to a shared constant, a scenario in which the
        # mechanism BY DEFINITION has nothing to differentiate. It stays in the mix so
        # the policy does not learn that "failure => a neighbour can always be chosen".
        - {weight: 1, kind: mask, level: 0.25, unit: intersection}
        # dead WITHOUT a trace: a frozen reading instead of zero. `onset: 60` is
        # necessary: a detector dead from the first decision has nothing to hold
        # and `hold` degenerates to `zero` (see `domain/sensors.py`).
        - {weight: 1, kind: mask, level: 0.25, substitution: hold, onset: 60}
        # miscalibration, the UNOBSERVABLE level; the head does not detect it
        # (AUROC 0.536), so it is here as a test that it does no harm
        - {weight: 1, kind: drift, level: 0.3}
    #
    # WHAT THE MIX LEAVES OUT AND WHY: `mask 0.75` and `gauss 4.0`. At these levels
    # EVERYTHING that reads the sensors loses to FixedTime by 45%; that is the
    # domain of the fallback gate (section 2 of the note), not of neighbour
    # weighting. Publishability is decided by the middle range, weighted up here.
