# Ablacja 1.6 — reprezentacja stanu: ep zamiast ats (progresja queue→pressure→ep→ats).
# Nagroda bez zmian (−Σ queue), architektura bez zmian.
#
# GPU (entry: core) — do liczenia na gliderze. Sufiks run_id = nazwa pliku.
entry: core
mode: realistic
timeout: 86400
ngpu: "0"

grid:
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2]

overrides:
  model: {state: ep}
