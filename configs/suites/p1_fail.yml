# Arm 2 of three (Phase 3, section 3 of `tsc_marl_research/faza3-po-t2.md`): the core
# trained WITH FAILURES but WITHOUT UW-attention.
#
# This is the CONTROL without which arm 3 means nothing. Training with failures
# improves robustness by itself (plain domain randomization), so with two arms,
# "core on clean" vs "core with failures and UW", the whole improvement could be
# attributed to training rather than to the mechanism. Three arms separate the causes:
#
#   1. core on clean               -> `p1_gate` (computed)
#   2. core with failures, NO UW   -> THIS suite
#   3. core with failures, WITH UW -> `p1_uw` (the same mix!)
#
# WARNING: the `failure_mix` BLOCK MUST BE IDENTICAL TO `p1_uw.yml`. A different mix
# confounds the mechanism with another training distribution and invalidates the
# 2 vs 3 comparison. Guarded by
# `tests/robustness/test_training.py::test_arms_share_the_failure_mix`.
#
# GPU (entry: core), to be computed on the GPU machine. run_id suffix = file name, i.e.
# `gatppo__<network>__s<seed>_y5__p1_fail`.
#
# Scale: JiNan x 3 seeds = 3 runs (the minimal version from the note). Widening = adding
# networks/seeds to `grid`; the `run_id` does not change, so computed points stay.
entry: core
mode: realistic
timeout: 86400
ngpu: "0"

grid:
  # HangZhou added 2026-09-20. Reason: `t2_gate_dr` showed DR + gate going below the
  # FixedTime threshold at `mask0p5` (481.1 vs 507.0), the only such configuration in
  # the thesis. The claim currently rests on ONE network, the first target for a
  # reviewer. The `run_id` does not change, so computed JiNan points are skipped.
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2]

overrides:
  model:
    # The scenario is drawn PER EPISODE from a stream (mix seed, episode number)
    # independent of the policy's `--seed`, so both arms see the same failure
    # schedule (see `robustness/training.py`). WHICH detectors fail is then chosen
    # by `SensorModel` from (spec.seed, episode), so two episodes with the same
    # scenario break different lanes.
    failure_mix:
      seed: 0
      scenarios:
        # 1/3 of episodes clean. Not caution but condition A3a: the policy must stay
        # comparable with the core on clean traffic, and the `clean` column in T2
        # is the reference for every degradation.
        - {weight: 4, kind: none}
        # measurement noise, the OBSERVABLE level; `uw_spread` in T2: 0.74 / 2.21
        - {weight: 1, kind: gauss, level: 1.0}
        - {weight: 1, kind: gauss, level: 2.0}
        # dead detectors with a trace (`zero`), the INFERABLE level; most of the
        # fallback gain lies here, and the mechanism has its best chance here
        - {weight: 2, kind: mask, level: 0.25}
        - {weight: 1, kind: mask, level: 0.5}
        # a whole intersection without sensors: all inbound edges equally uncertain,
        # softmax is invariant to a shared constant, a scenario in which the
        # mechanism BY DEFINITION has nothing to differentiate. It stays in the mix so
        # the policy does not learn that "failure => a neighbour can always be chosen".
        - {weight: 1, kind: mask, level: 0.25, unit: intersection}
        # dead WITHOUT a trace: a frozen reading instead of zero. `onset: 60` is
        # necessary: a detector dead from the first decision has nothing to hold
        # and `hold` degenerates to `zero` (see `domain/sensors.py`).
        - {weight: 1, kind: mask, level: 0.25, substitution: hold, onset: 60}
        # miscalibration, the UNOBSERVABLE level; the head does not detect it
        # (AUROC 0.536), so it is here as a test that it does no harm
        - {weight: 1, kind: drift, level: 0.3}
    #
    # WHAT THE MIX LEAVES OUT AND WHY: `mask 0.75` and `gauss 4.0`. At these levels
    # EVERYTHING that reads the sensors loses to FixedTime by 45%; that is the
    # domain of the fallback gate (section 2 of the note), not of neighbour
    # weighting. Publishability is decided by the middle range, weighted up here.
