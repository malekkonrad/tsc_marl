# Ramię 2 z trzech (Faza 3, §3 `tsc_marl_research/faza3-po-t2.md`): rdzeń trenowany
# Z AWARIAMI, ale BEZ UW-attention.
#
# To jest KONTROLA, bez której ramię 3 nic nie znaczy. Trening z awariami sam w sobie
# poprawia odporność (zwykły domain randomization), więc gdyby ramion było dwa —
# „rdzeń na czystym" vs „rdzeń z awariami i z UW" — cała poprawa dałaby się przypisać
# treningowi, a nie mechanizmowi. Trzy ramiona rozdzielają te dwie przyczyny:
#
#   1. rdzeń na czystym            -> `p1_gate` (policzone)
#   2. rdzeń z awariami, BEZ UW    -> TEN suite
#   3. rdzeń z awariami, Z UW      -> `p1_uw` (ta sama mieszanka!)
#
# ⚠ BLOK `failure_mix` MUSI BYĆ IDENTYCZNY Z `p1_uw.yml`. Różnica w mieszance miesza
# mechanizm z innym rozkładem treningowym i unieważnia porównanie 2↔3. Pilnuje tego
# `tests/robustness/test_training.py::test_ramiona_maja_te_sama_mieszanke`.
#
# GPU (entry: core) — do liczenia na gliderze. Sufiks run_id = nazwa pliku, czyli
# `gatppo__<sieć>__s<seed>_y5__p1_fail`.
#
# Skala: JiNan × 3 seedy = 3 biegi (wersja minimalna z notatki). Poszerzenie = dopisanie
# sieci/seedów do `grid`; `run_id` się nie zmienia, więc policzone punkty zostają.
entry: core
mode: realistic
timeout: 86400
ngpu: "0"

grid:
  # HangZhou dopisane 2026-09-20. Powód: `t2_gate_dr` pokazał, że DR + bramka schodzi
  # przy `mask0p5` pod próg FixedTime (481,1 vs 507,0) — jedyna taka konfiguracja
  # w pracy. Twierdzenie stoi dziś na JEDNEJ sieci i to jest pierwszy cel ataku
  # recenzenta. `run_id` się nie zmienia, więc policzone punkty JiNan zostają pominięte.
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2]

overrides:
  model:
    # Scenariusz losowany NA EPIZOD ze strumienia (seed mixu, numer epizodu) —
    # niezależnego od `--seed` polityki, żeby oba ramiona widziały ten sam
    # harmonogram awarii (patrz `robustness/training.py`). KTÓRE detektory padną,
    # wybiera już `SensorModel` z (spec.seed, episode), więc dwa epizody z tym
    # samym scenariuszem psują inne pasy.
    failure_mix:
      seed: 0
      scenarios:
        # 1/3 epizodów czystych. Nie ostrożność, tylko warunek A3a: polityka ma
        # zostać porównywalna z rdzeniem na czystym ruchu, a kolumna `clean` w T2
        # jest odniesieniem dla wszystkich degradacji.
        - {weight: 4, kind: none}
        # szum pomiarowy — poziom OBSERWOWALNY, `uw_spread` na T2: 0,74 / 2,21
        - {weight: 1, kind: gauss, level: 1.0}
        - {weight: 1, kind: gauss, level: 2.0}
        # martwe detektory ze śladem (`zero`) — poziom WNIOSKOWALNY, tu leży
        # większość zysku fallbacku i tu mechanizm ma największą szansę
        - {weight: 2, kind: mask, level: 0.25}
        - {weight: 1, kind: mask, level: 0.5}
        # całe skrzyżowanie bez czujników: wszystkie krawędzie wchodzące równie
        # niepewne, softmax na wspólną stałą niezmienniczy — scenariusz, w którym
        # mechanizm Z DEFINICJI nie ma czego różnicować. Zostaje w mieszance, żeby
        # polityka nie uczyła się, że „awaria ⇒ zawsze da się wybrać sąsiada".
        - {weight: 1, kind: mask, level: 0.25, unit: intersection}
        # martwe BEZ śladu: zamrożony odczyt zamiast zera. `onset: 60` jest
        # konieczne — detektor martwy od pierwszej decyzji nie ma czego trzymać
        # i `hold` degeneruje się do `zero` (patrz `domain/sensors.py`).
        - {weight: 1, kind: mask, level: 0.25, substitution: hold, onset: 60}
        # rozkalibrowanie — poziom NIEOBSERWOWALNY; głowa go nie wykrywa
        # (AUROC 0,536), więc jest tu jako test, czy nie szkodzi
        - {weight: 1, kind: drift, level: 0.3}
    #
    # CZEGO W MIESZANCE NIE MA I DLACZEGO: `mask 0.75` i `gauss 4.0`. Przy tych
    # poziomach WSZYSTKO, co czyta czujniki, przegrywa z FixedTime o 45% — to jest
    # dziedzina bramki fallbacku (§2 notatki), nie ważenia sąsiadów. O
    # publikowalności decyduje zakres środkowy i on jest tu przeważony.
