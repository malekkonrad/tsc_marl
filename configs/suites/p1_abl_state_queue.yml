# Ablation 1.6: state representation: queue instead of ats (progression queue->pressure->ep->ats).
# Reward unchanged (-sum queue), architecture unchanged.
#
# GPU (entry: core), to be computed on the GPU machine. run_id suffix = file name.
entry: core
mode: realistic
timeout: 86400
ngpu: "0"

grid:
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2]

overrides:
  model: {state: queue}
