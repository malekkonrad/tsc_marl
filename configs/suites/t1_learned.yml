# T1: learned DQN-class baselines from LibSignal, REALISTIC MODE (yellow=5).
# The CoLight numbers from the sandbox (287.3) were produced with the broken
# `att_last10` and before the `save_model` patch, so they are NOT a result of this
# repo; here they are computed again. Without CoLight the T1 table has no classic
# GAT+DQN baseline next to the core.
#
# CPU by necessity: `agent/colight.py` and `presslight.py` in the submodule have no
# device handling (see the comment in p1_reference.yml). This grid is therefore
# GOOD FOR A MACHINE WITHOUT A CARD, where a GPU would idle anyway.
entry: tsc
mode: realistic
timeout: 86400
ngpu: "-1"

grid:
  agent: [colight, presslight]
  network: [cityflow_jinan3x4_4ph, cityflow_hangzhou4x4_4ph]
  seed: [0, 1, 2]
