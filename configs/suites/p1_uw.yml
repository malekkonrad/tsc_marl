# Ramię 3 z trzech (Faza 3, §3 `tsc_marl_research/faza3-po-t2.md`): rdzeń trenowany
# Z AWARIAMI i Z UW-attention — jedyny bieg, w którym polityka MOŻE nauczyć się
# polegać na log ρ.
#
# Pytanie, na które ten suite odpowiada: T2 (`results/t2_uw.md`) pokazało, że
# modulacji NIE DA SIĘ dokleić do gotowej polityki — na JiNan przy `gauss4` rozstęp
# log ρ sięgał 6,12 nata („ufaj temu sąsiadowi 450× mniej"), a ATT nie drgnęło
# (347,4 → 347,3). To NIE jest to samo, co „architektura trenowana z nim nic by nie
# dała", i właśnie tę różnicę mierzy ten bieg.
#
# Warunek sensowności: trening MUSI iść z awariami. Na czystym ruchu zmierzone
# `uw_active` ≈ 3%, `uw_spread` ≈ 0,39 — polityka przez cały trening prawie nie
# zobaczyłaby modulacji i eksperyment wyszedłby pusty z powodu trywialnego,
# nieodróżnialnego od wyniku merytorycznego.
#
# ⚠ BLOK `failure_mix` MUSI BYĆ IDENTYCZNY Z `p1_fail.yml` — patrz komentarz tam.
# Jedyną różnicą między tymi dwoma suite'ami ma być klucz `uw`.
#
# WYMAGA artefaktów głowy dla każdej sieci z `grid` (głowa jest ZAMROŻONA, liczy się
# pod `no_grad`, nie ma jej w checkpointcie):
#     tsc obshead -n <sieć> --save --window 12 --persistence
#
# GPU (entry: core). Sufiks run_id = nazwa pliku: `gatppo__<sieć>__s<seed>_y5__p1_uw`.
entry: core
mode: realistic
timeout: 86400
ngpu: "0"

grid:
  network: [cityflow_jinan3x4_4ph]
  seed: [0, 1, 2]

overrides:
  model:
    # τ dobrane RAZ, na tabeli rozstępu log ρ w grupie softmaxu (`obs_head.DEFAULT_TAU`),
    # i takie samo jak w planie `t2_uw` — inaczej ramię 3 uczyłoby się na innym
    # sygnale, niż potem mierzy `tsc degrade`.
    uw: {tau: 0.25}
    failure_mix:
      seed: 0
      scenarios:
        # 1/3 epizodów czystych. Nie ostrożność, tylko warunek A3a: polityka ma
        # zostać porównywalna z rdzeniem na czystym ruchu, a kolumna `clean` w T2
        # jest odniesieniem dla wszystkich degradacji.
        - {weight: 4, kind: none}
        # szum pomiarowy — poziom OBSERWOWALNY, `uw_spread` na T2: 0,74 / 2,21
        - {weight: 1, kind: gauss, level: 1.0}
        - {weight: 1, kind: gauss, level: 2.0}
        # martwe detektory ze śladem (`zero`) — poziom WNIOSKOWALNY, tu leży
        # większość zysku fallbacku i tu mechanizm ma największą szansę
        - {weight: 2, kind: mask, level: 0.25}
        - {weight: 1, kind: mask, level: 0.5}
        # całe skrzyżowanie bez czujników: wszystkie krawędzie wchodzące równie
        # niepewne, softmax na wspólną stałą niezmienniczy — scenariusz, w którym
        # mechanizm Z DEFINICJI nie ma czego różnicować. Zostaje w mieszance, żeby
        # polityka nie uczyła się, że „awaria ⇒ zawsze da się wybrać sąsiada".
        - {weight: 1, kind: mask, level: 0.25, unit: intersection}
        # martwe BEZ śladu: zamrożony odczyt zamiast zera. `onset: 60` jest
        # konieczne — detektor martwy od pierwszej decyzji nie ma czego trzymać
        # i `hold` degeneruje się do `zero` (patrz `domain/sensors.py`).
        - {weight: 1, kind: mask, level: 0.25, substitution: hold, onset: 60}
        # rozkalibrowanie — poziom NIEOBSERWOWALNY; głowa go nie wykrywa
        # (AUROC 0,536), więc jest tu jako test, czy nie szkodzi
        - {weight: 1, kind: drift, level: 0.3}
    #
    # CZEGO W MIESZANCE NIE MA I DLACZEGO: `mask 0.75` i `gauss 4.0`. Przy tych
    # poziomach WSZYSTKO, co czyta czujniki, przegrywa z FixedTime o 45% — to jest
    # dziedzina bramki fallbacku (§2 notatki), nie ważenia sąsiadów. O
    # publikowalności decyduje zakres środkowy i on jest tu przeważony.
