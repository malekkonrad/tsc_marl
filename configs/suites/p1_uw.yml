# Arm 3 of three (Phase 3, section 3 of `tsc_marl_research/faza3-po-t2.md`): the core
# trained WITH FAILURES and WITH UW-attention, the only run in which the policy CAN
# learn to rely on log rho.
#
# The question this suite answers: T2 (`results/t2_uw.md`) showed the modulation
# CANNOT be bolted onto a finished policy: on JiNan at `gauss4` the log rho spread
# reached 6.12 nats ("trust this neighbour 450x less") and ATT did not move
# (347.4 -> 347.3). That is NOT the same as "an architecture trained with it would
# gain nothing", and this run measures exactly that difference.
#
# Condition for meaning: training MUST include failures. On clean traffic the measured
# `uw_active` is ~3%, `uw_spread` ~0.39: the policy would barely see the modulation
# during training and the experiment would come out empty for a trivial reason,
# indistinguishable from a substantive result.
#
# WARNING: the `failure_mix` BLOCK MUST BE IDENTICAL TO `p1_fail.yml`, see the comment
# there. The only difference between these two suites must be the `uw` key.
#
# REQUIRES head artefacts for every network in `grid` (the head is FROZEN, computed
# under `no_grad`, not part of the checkpoint):
#     tsc obshead -n <network> --save --window 12 --persistence
#
# GPU (entry: core). run_id suffix = file name: `gatppo__<network>__s<seed>_y5__p1_uw`.
entry: core
mode: realistic
timeout: 86400
ngpu: "0"

grid:
  network: [cityflow_jinan3x4_4ph]
  seed: [0, 1, 2]

overrides:
  model:
    # tau chosen ONCE, on the table of the log rho spread in a softmax group
    # (`obs_head.DEFAULT_TAU`), and the same as in plan `t2_uw`; otherwise arm 3 would
    # learn on another signal than `tsc degrade` later measures.
    uw: {tau: 0.25}
    failure_mix:
      seed: 0
      scenarios:
        # 1/3 of episodes clean. Not caution but condition A3a: the policy must stay
        # comparable with the core on clean traffic, and the `clean` column in T2
        # is the reference for every degradation.
        - {weight: 4, kind: none}
        # measurement noise, the OBSERVABLE level; `uw_spread` in T2: 0.74 / 2.21
        - {weight: 1, kind: gauss, level: 1.0}
        - {weight: 1, kind: gauss, level: 2.0}
        # dead detectors with a trace (`zero`), the INFERABLE level; most of the
        # fallback gain lies here, and the mechanism has its best chance here
        - {weight: 2, kind: mask, level: 0.25}
        - {weight: 1, kind: mask, level: 0.5}
        # a whole intersection without sensors: all inbound edges equally uncertain,
        # softmax is invariant to a shared constant, a scenario in which the
        # mechanism BY DEFINITION has nothing to differentiate. It stays in the mix so
        # the policy does not learn that "failure => a neighbour can always be chosen".
        - {weight: 1, kind: mask, level: 0.25, unit: intersection}
        # dead WITHOUT a trace: a frozen reading instead of zero. `onset: 60` is
        # necessary: a detector dead from the first decision has nothing to hold
        # and `hold` degenerates to `zero` (see `domain/sensors.py`).
        - {weight: 1, kind: mask, level: 0.25, substitution: hold, onset: 60}
        # miscalibration, the UNOBSERVABLE level; the head does not detect it
        # (AUROC 0.536), so it is here as a test that it does no harm
        - {weight: 1, kind: drift, level: 0.3}
    #
    # WHAT THE MIX LEAVES OUT AND WHY: `mask 0.75` and `gauss 4.0`. At these levels
    # EVERYTHING that reads the sensors loses to FixedTime by 45%; that is the
    # domain of the fallback gate (section 2 of the note), not of neighbour
    # weighting. Publishability is decided by the middle range, weighted up here.
