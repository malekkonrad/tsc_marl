# FROZEN EXPERIMENTAL PROTOCOL (engineering thesis, GAT/PPO/CTDE)
#
# One config shared by ALL methods. Reason: Wu 2021, with an inconsistent protocol
# method rankings flip. Values follow the Advanced-CoLight / Efficient-MP line, so
# the numbers are comparable with the papers.
#
# NOTE: this file must be the LAST element of `includes:` in an agent config, and the
# agent config itself MUST NOT override these fields (a direct config wins over
# includes, see utils/logger.py:load_config).
#
# LibSignal defaults changed on purpose:
#   action_interval: 10 (base) / 20 (magd, maddpg_v2) -> 15
#   saveReplay: True -> False (replays grow large; enable by hand for recordings)

trainer:
  # dt = min action duration = 15 s (Advanced-CoLight, Efficient-MP)
  action_interval: 15
  # 5 s of transition = yellow 3 s + all-red 2 s. LibSignal/CityFlow models this with
  # one parameter (one transition phase), so 3+2 is written as 5, consistent in sum
  # with the protocol and the whole CoLight/Advanced line.
  yellow_length: 5
  # episode = 60 min
  steps: 3600
  test_steps: 3600
  # CityFlow thread_num. Verified: with 4 threads CityFlow gives bit-identical
  # results across runs, so it stays at 4 (faster).
  thread: 4

world:
  seed: 0
  saveReplay: False
