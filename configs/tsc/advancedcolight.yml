includes:
  - configs/tsc/colight.yml            # GAT architecture and stability fixes, unchanged
  - configs/tsc/thesis_protocol.yml    # frozen protocol, must be LAST

model:
  name: advancedcolight
  # OBS_LENGTH=167 from the reference implementation (~ V_max * dt = 165 m, Def. 8).
  # A SHARED window for the queue (pressure) and moving vehicles (demand), as in
  # advancedmp.yml, so both methods see the same stretch of lane.
  obs_length: 167
  # Right turns have green in EVERY phase -> they are not controlled movements
  # and do not enter ATS (otherwise the state vector has 12 movements instead of 8).
  drop_always_green: true
  # NOTE: ATS is NOT normalised. `vehicle_max` divides the observation in CoLight,
  # but with vehicle_max=1 it is a no-op, and for pressure (a DIFFERENCE that can be
  # negative) dividing by "the maximum number of vehicles on a lane" has no
  # interpretation. The state enters the network raw, as in the paper.
