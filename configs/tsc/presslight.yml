includes:
  - configs/tsc/base.yml
  - configs/tsc/thesis_protocol.yml   # frozen protocol, must be LAST


model:
  name: presslight
  train_model: True
  d_dense: 20
  epsilon: 0.1
  epsilon_decay: 0.995
  epsilon_min: 0.01
  one_hot: True
  phase: True



trainer:
  learning_start: 1000
  episodes: 200
  # The same fix as in colight.yml: update_target_rate counts DECISIONS, and the
  # base.yml default (10) means updating the target network every 10 steps instead of
  # 500-10000. PressLight survived it thanks to a simple MLP, but the protocol must be
  # ONE for all DQN methods, otherwise methods are compared under different settings.
  buffer_size: 20000
  update_target_rate: 500
