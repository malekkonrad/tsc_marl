includes:
  - configs/tsc/base.yml
  - configs/tsc/thesis_protocol.yml   # frozen protocol, must be LAST

model:
  name: advancedmp
  t_min: 15   # = dt; max-pressure methods decide once per action_interval
  # W1 = 1.0, the default of the authors' reference implementation (run_advanced_maxpressure.py: "W": 1).
  # Sweep optimum on JiNan in realistic mode (yellow=5): 299.2 s at W1=1.0.
  w1: 1.0
  # OBS_LENGTH=167 from the reference implementation (~ V_max * dt = 165 m, Def. 8).
  # A SHARED window for the queue (pressure) and moving vehicles (demand): the authors
  # compute both from the same stretch of lane, the paper does not say so.
  obs_length: 167
  # Right turns are allowed in EVERY phase -> they do not compete for green.
  # In p(s) they add a constant (argmax unchanged), but in d(s) they inflate demand
  # and skew the comparison d * W1 > max p. The authors sum controlled movements only.
  drop_always_green: true

trainer:
  episodes: 1   # a method without training
  buffer_size: 0
  learning_rate: 0
  learning_start: 0
  update_model_rate: 0
  update_target_rate: 0

logger:
  save_rate: 0
  train_model: False
  test_model: True
  load_model: False
