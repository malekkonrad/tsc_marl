# The Phase 1 core: GAT + PPO + CTDE. Entry point: `src/tsc_marl/runner/train_core.py`.
#
# Inherits from `advancedcolight.yml`, i.e. THE SAME state representation (ATS,
# obs_length 167, drop_always_green) and THE SAME GAT architecture
# (NODE_EMB_DIM/INPUT_DIM/OUTPUT_DIM/NUM_HEADS from colight.yml, read by
# `GATEncoder.registry_kwargs`). The only intended difference from the baseline is
# the learning algorithm, which is why the Phase 1 GATE measures what it should.
#
# PPO hyperparameters LIVE HERE, not in code: `experiment.build_params` fingerprints
# the `model` + `trainer` sections, so changing `clip_range` invalidates skip-if-done.
# A value living only in Python would let a run with other settings pass as
# "already computed".
includes:
  - configs/tsc/advancedcolight.yml   # ATS state + GAT architecture
  - configs/tsc/thesis_protocol.yml   # frozen protocol, must be LAST

model:
  name: gatppo
  graphic: True          # the core always needs the graph (Graph_World_Interface)
  train_model: True

  # --- state and reward variant (ablation 1.6 switches) ---
  state: ats             # queue | pressure | ep | ats
  reward: queue          # queue | pressure

  # --- PPO (PPOConfig fields; comments next to unusual values) ---
  # gamma counts DECISIONS: at dt=15 s an episode has 240 of them, so 0.95 is a
  # horizon of ~20 decisions = 5 minutes of traffic. The same value as in base.yml, so
  # discounting is a shared axis with CoLight and Advanced-CoLight (MAPPO uses 0.99).
  gamma: 0.95
  gae_lambda: 0.95
  clip_range: 0.2
  value_clip_range: 0.2
  epochs: 10
  n_minibatches: 4
  actor_lr: 0.0003
  critic_lr: 0.001
  entropy_coef: 0.01
  value_coef: 0.5
  # the PPO convention. `grad_clip: 5.0` from base.yml is a DQN setting and barely
  # clips under PPO, hence a separate field rather than overriding that one.
  max_grad_norm: 0.5
  normalize_advantage: True
  normalize_values: True
  target_kl: null        # clipping suffices; the emergency brake is enabled deliberately
