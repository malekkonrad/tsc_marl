[project]
name = "tsc-marl"
version = "0.1.0"
description = "Uncertainty-aware multi-agent GNN traffic signal control (praca inżynierska)"
requires-python = ">=3.10,<3.11"

# Wersje odtwarzają środowisko, w którym powstały wyniki Fazy 0 — nie są "najnowsze",
# tylko "te, które przeszły GATE". Pułapki, które kosztowały czas, są opisane niżej.
dependencies = [
    # --- symulatory ---
    "eclipse-sumo==1.27.1",   # SUMO z pipa, NIE z apt: apt na Ubuntu noble daje 1.18,
    "libsumo==1.27.1",        # a libsumo z pipa jest 1.27 i wersje muszą się zgadzać
    "traci==1.27.1",
    "sumolib==1.27.1",
    # CityFlow nie jest na PyPI — buduje się ze źródeł (wymaga cmake + g++):
    "cityflow @ git+https://github.com/cityflow-project/CityFlow.git@81ee0f4",

    # --- uczenie ---
    "torch==2.4.1",
    "torch-geometric==2.8.0.post1",
    "numpy==1.26.4",          # <2.0: ABI skompilowanych kół (PyG, torch-scatter)

    # --- czego LibSignal wymaga, a czego NIE MA w jego requirements.txt ---
    "gym==0.26.2",            # ich pin 0.21 ma zepsute metadane i nie instaluje się
    "pfrl==0.4.0",
    "packaging",
    "lmdb",                   # importowane w dataset/onfly_dataset.py, czyli przy KAŻDYM runie

    # --- CLI ---
    # Jedno wejście `tsc` z podkomendami. Pure-python (typer + click), nie dotyka
    # numeryki, więc nie zmienia odtwarzalności wyników.
    "typer",

    # --- analiza wyników ---
    "pandas",
    "scipy",
    "matplotlib",
    "networkx",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
# torch-scatter to koło budowane pod konkretną parę (torch, CUDA), więc żyje osobno.
# CPU:  make setup       (torch+cpu  z download.pytorch.org/whl/cpu)
# CUDA: make setup-gpu   (torch+cu121 z download.pytorch.org/whl/cu121)
cpu = ["torch-scatter==2.1.2"]
gpu = ["torch-scatter==2.1.2"]
dev = ["ruff", "pytest"]

[project.scripts]
# `tsc` ląduje w .venv/bin po `uv pip install -e .`. Do tego czasu działa
# równoważne `python -m tsc_marl`.
tsc = "tsc_marl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# CityFlow nie jest na PyPI, więc wisi jako referencja do gita (`cityflow @ git+...`).
# Bez tej flagi hatchling odmawia zbudowania metadanych pakietu.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# runlog jest osobnym pakietem, nie podpakietem tsc_marl — nie importuje z niego
# niczego i ma dać się wyjąć do własnego repo jednym `git mv`.
packages = ["src/tsc_marl", "src/runlog"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# LibSignal wymaga importów po ustawieniu sys.path (patrz tsc_marl/libsignal.py),
# więc importy nie-na-górze-pliku są tu zamierzone.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Nazewnictwo z papierów: W1/L/M/N oraz `l`,`m` na ruch (l,m) w definicjach pressure.
# Zmiana na czytelniejsze nazwy rozjechałaby kod z wzorami, które implementuje.
"src/tsc_marl/agents/*" = ["N803", "N806", "E741"]
# Testy nazywamy po polsku i asercje piszemy wprost — bez wymogów dla kodu produkcyjnego.
"tests/*" = ["N802"]
# runlog to narzędzie ogólnego przeznaczenia — bez wyjątków nazewniczych z papierów.

[tool.pytest.ini_options]
# Testy nie potrzebują silnika (patrz tests/conftest.py), ale conftest ustawia
# sys.path na submoduł — dlatego jeden wspólny rootdir i żadnych testów w external/.
testpaths = ["tests"]
# `-m "not slow"` w addopts = domyślnie lecą TYLKO szybkie. Argument z linii poleceń
# nadpisuje tę wartość (pytest bierze ostatnie `-m`), więc `pytest -m slow` uruchamia
# same wolne, a `pytest -m ""` — wszystkie. Bez rejestracji markera w `markers`
# pytest sypie ostrzeżeniem przy każdym uruchomieniu.
addopts = "-q -m 'not slow'"
markers = [
  "slow: wymaga postawionego symulatora CityFlow (~15 s na sesję zamiast ~2 s)",
]

[tool.pyright]
# Bez tego LSP w edytorze nie widzi ANI zależności z venva, ANI modułów LibSignala.
# Powód dla LibSignala jest strukturalny: `external/LibSignal` trafia na sys.path
# dopiero w runtime, w tsc_marl.libsignal.bootstrap() — analiza statyczna nie ma
# jak się tego domyślić, więc trzeba jej to powiedzieć wprost.
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
extraPaths = ["src", "external/LibSignal"]

# Podpowiedzi auto-importu w edytorze. `autoImportCompletions` jest domyślnie włączone,
# ale `indexing` NIE (domyślnie false) — a bez indeksu pyright podpowiada tylko symbole
# z plików, które już sparsował, i z top-levelu pakietów. Z indeksem widzi podmoduły,
# czyli np. `torch.nn.functional` czy warstwy z `torch_geometric.nn`, bez wcześniejszego
# zaimportowania ich w pliku. Kosztuje kilka sekund i trochę RAM-u przy starcie LSP.
# `indexing` nie jest opisane w README pyrighta, ale parser configu je obsługuje.
indexing = true
autoImportCompletions = true
useLibraryCodeForTypes = true

# Cudzy kod analizujemy tylko na tyle, żeby rozwiązywać importy — nie chcemy jego
# błędów w naszym oknie diagnostyki.
exclude = ["external", ".venv", "runs", "data", "deploy"]

[tool.uv]
# Środowisko budujemy `make setup` (uv venv + uv pip install z indeksem torcha
# CPU albo CUDA), a NIE `uv sync`. Bez tej flagi `uv run` domyślnie synchronizuje
# .venv z samego pyproject.toml — czyli podmienia `torch 2.4.1+cpu` na build CUDA
# (~2,5 GB wheeli nvidia-*), KASUJE `torch-scatter` (żyje w extra `cpu`/`gpu`)
# i wyrzuca ruff/pytest. Jeden `uv run` niszczyłby wtedy środowisko, w którym
# powstały wyniki. `managed = false` wyłącza tę synchronizację: `uv run` po prostu
# używa .venv, a `uv sync` odmawia z czytelnym komunikatem.
#
# `uv venv` i `uv pip` działają bez zmian — one nie chodzą przez tryb projektowy.
managed = false
