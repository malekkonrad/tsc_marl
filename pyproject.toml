[project]
name = "tsc-marl"
version = "0.1.0"
description = "Multi-agent GNN traffic signal control (engineering thesis)"
requires-python = ">=3.10,<3.11"

# Pinned to the environment that produced the thesis results, not to the latest releases.
dependencies = [
    # --- simulators ---
    "eclipse-sumo==1.27.1",   # SUMO from pip, not apt: Ubuntu noble ships 1.18, while
    "libsumo==1.27.1",        # pip's libsumo is 1.27 and the versions must match
    "traci==1.27.1",
    "sumolib==1.27.1",
    # CityFlow is not on PyPI, built from source (needs cmake + g++):
    "cityflow @ git+https://github.com/cityflow-project/CityFlow.git@81ee0f4",

    # --- learning ---
    "torch==2.4.1",
    "torch-geometric==2.8.0.post1",
    "numpy==1.26.4",          # <2.0: ABI of the compiled wheels (PyG, torch-scatter)

    # --- required by LibSignal but missing from its requirements.txt ---
    "gym==0.26.2",            # their 0.21 pin has broken metadata and does not install
    "pfrl==0.4.0",
    "packaging",
    "lmdb",                   # imported by dataset/onfly_dataset.py on every run

    # --- CLI ---
    "typer",

    # --- analysis ---
    "pandas",
    "scipy",
    "matplotlib",
    "networkx",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
# torch-scatter wheels are built per (torch, CUDA) pair, so they live in extras.
# CPU:  make setup       (torch+cpu   from download.pytorch.org/whl/cpu)
# CUDA: make setup-gpu   (torch+cu121 from download.pytorch.org/whl/cu121)
cpu = ["torch-scatter==2.1.2"]
gpu = ["torch-scatter==2.1.2"]
dev = ["ruff", "pytest"]

[project.scripts]
# Installed into .venv/bin by `uv pip install -e .`; `python -m tsc_marl` is equivalent.
tsc = "tsc_marl.runner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# CityFlow is a direct git reference (`cityflow @ git+...`); hatchling refuses it without this.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# runlog is a separate top-level package: it imports nothing from tsc_marl and can be
# moved to its own repository unchanged.
packages = ["src/tsc_marl", "src/runlog"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# LibSignal modules can only be imported after sys.path is set (tsc_marl/libsignal/bridge.py),
# so imports below the top of a file are intentional.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Variable names follow the papers: `l`, `m` for a movement (l, m) in pressure formulas.
"src/tsc_marl/domain/*" = ["E741"]
"src/tsc_marl/libsignal/agents/*" = ["E741"]

[tool.pytest.ini_options]
# Tests do not need the engine, but conftest puts the submodule on sys.path,
# hence one rootdir and no test collection in external/.
testpaths = ["tests"]
# Fast tests only by default; a later `-m` on the command line wins, so
# `pytest -m slow` runs the slow ones and `pytest -m ""` runs everything.
addopts = "-q -m 'not slow'"
markers = [
  "slow: needs a running simulator, CityFlow or SUMO (~20 s for the whole set)",
]

[tool.pyright]
# Lets the editor's LSP see the venv and LibSignal, which only reaches sys.path at
# runtime (tsc_marl.libsignal.bootstrap()).
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
extraPaths = ["src", "external/LibSignal"]

# Index submodules (e.g. torch.nn.functional) for auto-import completions.
indexing = true
autoImportCompletions = true
useLibraryCodeForTypes = true

# Third-party code is analysed only to resolve imports.
exclude = ["external", ".venv", "runs", "data"]

[tool.uv]
# The environment is built by `make setup` (CPU or CUDA torch index), not `uv sync`.
# Without this flag `uv run` would sync .venv from pyproject.toml alone: replace
# torch+cpu with the CUDA build, remove torch-scatter (an extra) and drop ruff/pytest.
# With it, `uv run` just uses .venv and `uv sync` refuses.
managed = false
